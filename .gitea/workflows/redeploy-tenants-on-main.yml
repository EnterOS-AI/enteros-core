name: redeploy-tenants-on-main

# Compatibility filename for the production inventory audit. Releases are now
# staging-qualified, manual actions in promote-prod-tenant-pin.yml. This workflow
# only reports existing inventory drift; it never writes a pin or a workload.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-tenant-inventory
  cancel-in-progress: false

jobs:
  # bp-exempt: independent operational audit; never a code or release gate
  redeploy-k8s:
    if: github.ref == 'refs/heads/main'
    runs-on: local-deploy
    timeout-minutes: 15
    env:
      INFISICAL_CI_CLIENT_ID: ${{ secrets.INFISICAL_CI_CLIENT_ID }}
      INFISICAL_CI_CLIENT_SECRET: ${{ secrets.INFISICAL_CI_CLIENT_SECRET }}
      INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_CI_PROJECT_ID }}
      INFISICAL_SECRET_ENV: prod
      CP_CENSUS_NAMESPACE: ${{ vars.CP_PROD_NAMESPACE || 'controlplane-prod' }}
      CP_CENSUS_DB_POD: ${{ vars.CP_PROD_DB_POD || 'controlplane-db-postgres-0' }}
      CP_CENSUS_DB_USER: ${{ vars.CP_PROD_DB_USER || 'cp' }}
      CP_CENSUS_DB_NAME: ${{ vars.CP_PROD_DB_NAME || 'cp_prod' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve the deploy toolchain
        run: |
          set -euo pipefail
          resolved="$(bash scripts/deploy/require-deploy-toolchain.sh \
            'DEPLOY_PYTHON3:python3:python3:--version' \
            'KUBECTL:kubectl:kubectl:version --client')"
          test -n "$resolved"
          printf '%s\n' "$resolved" >> "$GITHUB_ENV"
      - name: Read production inventory
        run: |
          set -euo pipefail
          bash scripts/deploy/resolve-k8s-fleet-census.sh --allow-empty --env-out "$RUNNER_TEMP/fleet.env"
          cat "$RUNNER_TEMP/fleet.env" >> "$GITHUB_ENV"
      - name: Audit missing production workloads
        run: |
          set -euo pipefail
          digest="$("$KUBECTL" -n "$CP_CENSUS_NAMESPACE" exec -i "$CP_CENSUS_DB_POD" -- \
            psql -U "$CP_CENSUS_DB_USER" -d "$CP_CENSUS_DB_NAME" -At -v ON_ERROR_STOP=1 \
            -c "SELECT image_digest FROM runtime_image_pins WHERE template_name='molecule-tenant' AND region='global';")"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::production pin has no valid digest for the read-only inventory plan"
            exit 1
          fi
          bash scripts/deploy/fleet-drift-audit.sh --strict --digest "$digest"
      - name: Remove temporary cluster credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/fleet.kubeconfig"
