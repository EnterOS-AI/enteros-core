name: redeploy-tenants-on-main

# molecules-server rework (2026-07-03): re-enabled + un-EC2'd (production).
#
# History: this workflow rolled the production tenant fleet by calling the CP
# admin endpoint /cp/admin/tenants/redeploy-fleet, which fanned out over AWS
# SSM to one-tenant-per-EC2 boxes. It was DISABLED 2026-06-27 when the AWS
# account was closed. Molecules-Server / local Docker is now one supported
# production provider path (provider='local', the LocalDocker provisioner),
# alongside control-plane-managed providers; the EC2/SSM path is dead. This
# workflow sees only containers on its Docker host carrying the production
# label; it is not an inventory or rollout of the entire production tenant set.
#
# This workflow redeploys the local-docker PRODUCTION fleet by delegating to the
# ONE shared swap script, scripts/deploy/redeploy-staging-fleet.sh, with the
# production deltas passed as flags/env (label filter --cp-env production, the
# moving :latest tag, the shared prod canvas container). It differs from the
# staging path ONLY in those deltas and in the PROD_AUTO_DEPLOY_DISABLED kill
# switch (below).
#
# CANONICAL ALGORITHM = scripts/deploy/redeploy-staging-fleet.sh (SSOT). This
# used to inline a hand-copied duplicate of the canary-first / health-gated /
# self-rolling-back swap; that copy drifted from the staging one and — critically
# — carried the OLD host-loopback health gate (curl 127.0.0.1:<published-port>),
# which only works when the runner IS the tenant host. The shared script's gate
# probes /buildinfo DAEMON-SIDE (a curl sidecar in the tenant netns), so this
# same workflow works with either a local socket or a remotely configured Docker
# endpoint. Endpoint and transport selection belong to deploy-runner configuration;
# this repository does not prescribe an operator host or a host-login access path.
# Make algorithm changes in the script; this file only wires prod deltas.
#
# PROD SAFETY — the auto-trigger is re-enabled per the re-enable request, but a
# production roll is a side-effecting deploy, so it is HARD-GATED by
# PROD_AUTO_DEPLOY_DISABLED. While that kill switch is set (the current
# deploy-freeze posture) every run short-circuits with a notice and touches
# nothing — production stays frozen until an operator unsets it. This keeps the
# plumbing live without auto-rolling prod.
#
# This production redeploy is independent of the staging E2E workflows; those
# lanes provide separate evidence and are not an upstream dependency. This job's
# enforced controls are its kill switch plus the shared script's candidate-identity
# and daemon-side health gate.
#
# Rollback / pin: set the repo/org var PROD_MANUAL_REDEPLOY_TARGET_TAG to a
# known-good tag and run via workflow_dispatch; unset it afterward.

on:
  # RE-ENABLED 2026-07-03 (was: workflow_dispatch-only). Gated by
  # PROD_AUTO_DEPLOY_DISABLED — see the header + the kill-switch step.
  push:
    branches: [main]
    paths:
      - 'canvas/**'
      - 'workspace-server/**'
      - 'scripts/deploy/redeploy-staging-fleet.sh'
      - '.gitea/workflows/redeploy-tenants-on-main.yml'
  workflow_dispatch:

permissions:
  contents: read

# Serialize per-branch so two rapid main pushes' redeploys don't overlap and
# leave the fleet half-rolled. cancel-in-progress:false — aborting a partial
# PROD roll mid-fleet is worse than letting it finish (each swap is
# health-gated + self-rolls-back, so a completed predecessor is always in a
# good state). Explicit here to match redeploy-tenants-on-staging.yml rather
# than lean on the Gitea/Actions default.
concurrency:
  group: redeploy-tenants-on-main
  cancel-in-progress: false

env:
  GITHUB_SERVER_URL: https://git.moleculesai.app
  TENANT_IMAGE: ${{ vars.MOLECULE_TENANT_IMAGE || 'registry.moleculesai.app/molecule-ai/molecule-tenant' }}
  # Production shared canvas app container name (analogue of molecule-staging-app).
  # Empty by default → the shared-app roll is skipped unless an operator sets it.
  PROD_CANVAS_APP_CONTAINER: ${{ vars.PROD_CANVAS_APP_CONTAINER || '' }}
  CANVAS_APP_IMAGE: ${{ vars.MOLECULE_CANVAS_APP_IMAGE || 'registry.moleculesai.app/molecule-ai/canvas' }}
  DEFAULT_TENANT_TAG: latest

jobs:
  redeploy:
    # local-deploy: the CI deploy runner whose production Docker endpoint is
    # supplied by runner configuration. The shared script's health gate runs
    # daemon-side, so it remains endpoint- and transport-agnostic; no host or
    # operator-login route is encoded in this workflow.
    runs-on: local-deploy
    timeout-minutes: 30
    env:
      PROD_AUTO_DEPLOY_DISABLED: ${{ vars.PROD_AUTO_DEPLOY_DISABLED || secrets.PROD_AUTO_DEPLOY_DISABLED || '' }}
      TARGET_TAG_OVERRIDE: ${{ vars.PROD_MANUAL_REDEPLOY_TARGET_TAG || secrets.PROD_MANUAL_REDEPLOY_TARGET_TAG || '' }}
    steps:
      - name: Kill-switch guard (production freeze)
        id: guard
        run: |
          set -euo pipefail
          case "$(printf '%s' "${PROD_AUTO_DEPLOY_DISABLED:-}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|on|disabled|disable)
              echo "::notice::PROD_AUTO_DEPLOY_DISABLED is set — production redeploy is frozen. Skipping."
              # Audit-trail marker so a future operator inspecting the run
              # summary can see WHY it short-circuited (not just an empty run).
              {
                echo "## Production fleet redeploy — SKIPPED (frozen)"
                echo ""
                echo "\`PROD_AUTO_DEPLOY_DISABLED\` is set — production auto-redeploy is frozen; no containers were touched. An operator must unset it to lift the freeze."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "skip=1" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "skip=0" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Checkout (for the shared swap script)
        if: ${{ steps.guard.outputs.skip == '0' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Redeploy local-docker production tenant fleet
        if: ${{ steps.guard.outputs.skip == '0' }}
        env:
          # Roll the shared PRODUCTION canvas app too, if an operator configured
          # one. The script's shared-canvas roll reads STAGING_CANVAS_APP_CONTAINER
          # (the generic "which shared-canvas container to roll" knob); pass the
          # prod container name through it. Empty => the roll is skipped.
          STAGING_CANVAS_APP_CONTAINER: ${{ env.PROD_CANVAS_APP_CONTAINER }}
          # Managed rollout flags SSOT (same repo var the staging rollers use). The
          # script strips every managed key from the inherited env and re-applies
          # ONLY what TENANT_FLAGS names, so this MUST be wired or a main-triggered
          # prod roll would silently turn an in-flight flag OFF fleet-wide.
          STAGING_TENANT_FLAGS: ${{ vars.STAGING_TENANT_FLAGS }}
        run: |
          set -euo pipefail
          TAG="${TARGET_TAG_OVERRIDE:-$DEFAULT_TENANT_TAG}"
          echo "::notice::Production tenant redeploy target tag = ${TAG}"
          # CANVAS_TAG follows the tenant tag so a pinned rollback rolls a matching
          # canvas; the shared script defaults it to the tenant tag anyway.
          # `${STAGING_TENANT_FLAGS-}` — the shell (not the templater) supplies the
          # default, so TENANT_FLAGS arrives SET-AND-EMPTY and the script's
          # fail-closed unset-check is satisfied while the flags stay dark.
          CANVAS_TAG="$TAG" \
          TENANT_FLAGS="${STAGING_TENANT_FLAGS-}" \
          bash scripts/deploy/redeploy-staging-fleet.sh --cp-env production --tag "$TAG"
          {
            echo "## Production fleet redeploy (molecules-server / local-docker)"
            echo ""
            echo "- Target tag: \`${TAG}\`"
            echo "- Rolled via the shared SSOT swap script (daemon-side health gate)."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Enter OS rebrand Phase 2 (internal#1089): ADVISORY dual-domain arm ──
      # The BLOCKING gate is unchanged and just ran above: the shared swap
      # script health-gates every rolled tenant's /buildinfo DAEMON-SIDE — the
      # service behind <slug>.moleculesai.app. This step ADDS a second,
      # NON-blocking probe of the SAME tenants through the NEW brand edge
      # (https://<slug>.enteros.ai/buildinfo, runner-side through DNS + CF +
      # tunnel ingress), measuring enteros.ai routing readiness that the
      # daemon-side gate cannot see. Until ops seeds the enteros.ai tenant
      # DNS/ingress this WARNS on every roll — that is the readiness signal,
      # not noise; the ::warning:: names exactly what to check.
      #
      # FLIP-TO-BLOCKING CONDITION: once ops seeds enteros.ai tenant routing
      # AND this step has soaked green across consecutive prod rolls, delete
      # the continue-on-error line below (and wire EXPECTED_BUILD_SHA from the
      # image's OCI revision label) so BOTH domains gate the deploy. The probe
      # script already fails closed, so the flip is only removing the mask.
      - name: Probe enteros.ai tenant buildinfo (advisory Phase-2 arm)
        if: ${{ steps.guard.outputs.skip == '0' }}
        # internal#1089 — Enter OS Phase 2: advisory until enteros.ai tenant
        # routing is ops-seeded + soak-green (flip condition in the comment above).
        continue-on-error: true
        env:
          ENTEROS_TENANT_DOMAIN: ${{ vars.ENTEROS_TENANT_DOMAIN || 'enteros.ai' }}
        run: |
          set -euo pipefail
          bash scripts/deploy/probe-enteros-buildinfo.sh \
            --cp-env production --domain "$ENTEROS_TENANT_DOMAIN"

  # ── THE K8S ARM ────────────────────────────────────────────────────────────
  #
  # WHY THIS JOB EXISTS. The `redeploy` job above enumerates production tenants
  # with `docker ps --filter label=molecule.cp-env=production`. Measured on the
  # production control plane (2026-08-10, org_substrates joined to
  # organizations): the production fleet is 5 orgs and EVERY ONE of them has
  # substrate='k8s'. None are on docker. So that filter matches nothing, the job
  # rolls nothing, and a pin promote has been reporting a successful fleet roll
  # while no tenant moved — work that runs and protects nothing, in deploy form.
  #
  # This job is the arm that actually rolls them, via the shared SSOT script.
  #
  # IT IS A SEPARATE JOB, NOT A STEP, so a docker arm that legitimately matches
  # zero containers cannot mask a k8s arm that failed, and vice versa. Each
  # reports its own counts and its own verdict.
  #
  # ── WHY THE FREEZE MAKES THIS PLAN-ONLY INSTEAD OF SKIPPING IT ─────────────
  #
  # The docker arm short-circuits entirely while PROD_AUTO_DEPLOY_DISABLED is
  # set. Doing the same here would mean the wiring below is never exercised until
  # the day someone lifts the freeze expecting a roll — and finds out THEN that a
  # secret is absent or the census returns nothing. That is the same "the
  # plumbing was live but had never carried anything" failure this chain exists
  # to stop.
  #
  # So the freeze selects --dry-run instead. A frozen run still resolves every
  # credential, runs the census, prints the counts and FAILS if any of it is
  # missing or empty. It touches no workload: --dry-run is the script's own plan
  # mode.
  # A production DEPLOY arm, not a merge gate: requiring it would block merges on
  # the state of production rather than on the state of the change, and its
  # sibling `redeploy` is out of branch protection for that same reason. What
  # guards this lane is the freeze plus the script's own roll-nothing refusal,
  # both of which run INSIDE the job rather than in branch protection.
  # bp-exempt: production deploy arm; gated by the freeze and the roller's own roll-nothing refusal, not by branch protection.
  redeploy-k8s:
    runs-on: local-deploy
    timeout-minutes: 45
    env:
      PROD_AUTO_DEPLOY_DISABLED: ${{ vars.PROD_AUTO_DEPLOY_DISABLED || secrets.PROD_AUTO_DEPLOY_DISABLED || '' }}
      # Where the production control plane's database actually runs. Overridable
      # as repo vars so a cutover does not need a code change, but defaulted to
      # the measured truth rather than left unset.
      CP_PROD_NAMESPACE: ${{ vars.CP_PROD_NAMESPACE || 'controlplane-prod' }}
      CP_PROD_DB_POD: ${{ vars.CP_PROD_DB_POD || 'controlplane-db-postgres-0' }}
      CP_PROD_DB_USER: ${{ vars.CP_PROD_DB_USER || 'cp' }}
      CP_PROD_DB_NAME: ${{ vars.CP_PROD_DB_NAME || 'cp_prod' }}
    steps:
      - name: Select mode (the freeze plans; it does not skip)
        id: mode
        run: |
          set -euo pipefail
          case "$(printf '%s' "${PROD_AUTO_DEPLOY_DISABLED:-}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|on|disabled|disable)
              echo "::notice::PROD_AUTO_DEPLOY_DISABLED is set — the k8s fleet arm runs PLAN-ONLY (--dry-run). No workload is touched."
              echo "dry=1" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::the production freeze is OFF — this run WILL roll the k8s tenant fleet."
              echo "dry=0" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Preflight — the roller must EXIST before anything claims to have run it
        run: |
          set -euo pipefail
          # scripts/deploy/redeploy-tenant-fleet-k8s.sh arrives with core#5154, so
          # this job must not land ahead of it. Checked explicitly rather than
          # left to `bash <missing>`, and deliberately NEVER softened into "skip
          # if absent": a step that quietly does nothing when its own tool is
          # missing is the vacuous pass this job replaces, reintroduced one level
          # up.
          if [ ! -f scripts/deploy/redeploy-tenant-fleet-k8s.sh ]; then
            echo "::error::scripts/deploy/redeploy-tenant-fleet-k8s.sh is missing (core#5154). Refusing to report a fleet roll this job cannot perform."
            exit 1
          fi
          echo "roller present: $(wc -l < scripts/deploy/redeploy-tenant-fleet-k8s.sh) lines"

      # ── THE TOOLCHAIN IS A DEPENDENCY, SO IT GETS A PREFLIGHT LIKE ONE ──────
      #
      # The step above proves the ROLLER exists. This job also depends on two
      # things the roller cannot supply: a python3 to run the Infisical SSOT
      # reader, and a kubectl to census and roll with. Neither was ever declared
      # anywhere, and the `local-deploy` runner has NEITHER — measured in the
      # runner's own environment (Alpine 3.23 host-executor pod, ci/deploy-runner
      # on robot-1), not in a login shell on the node:
      #
      #   python3 / python / python3.1x / pypy3 -> ABSENT (no python binary
      #       anywhere under /usr /bin /sbin /opt); kubectl -> ABSENT; jq -> ABSENT
      #   PATH of pid 1 (the runner process every step inherits) is identical to
      #       an interactive shell's, so this is NOT a service-vs-login PATH split
      #
      # That is why run 644986 died with `python3: command not found` (exit 127)
      # on the first push after the k8s arm merged. The remedy is not to hope the
      # image has them: it is to RESOLVE them by name, up front, into absolute
      # paths, and to say WHICH one is missing when one is. See
      # scripts/deploy/require-deploy-toolchain.sh for why provisioning lives
      # there and why setup-python / a job container / the pod ServiceAccount all
      # lose on this specific runner.
      - name: Preflight — resolve the toolchain, or NAME the tool that is missing
        run: |
          set -euo pipefail
          # NOT `... >> "$GITHUB_ENV"`. A capture that is redirected straight into
          # its destination is written before anything has judged it; validate
          # first, then write.
          rc=0
          resolved="$(bash scripts/deploy/require-deploy-toolchain.sh \
            'DEPLOY_PYTHON3:python3:python3:--version' \
            'KUBECTL:kubectl:kubectl:version --client')" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::the deploy toolchain preflight FAILED (exit ${rc}) on runner '${RUNNER_NAME:-<unknown>}'. The ::error:: above names the tool. This job stops here rather than dying mid-step on 'command not found', which is what run 644986 did."
            exit 1
          fi
          if [ -z "$resolved" ]; then
            echo "::error::the toolchain preflight exited 0 and resolved NOTHING. An empty result would leave every later step back on ambient PATH lookup while this step reported success — the vacuous pass this preflight exists to remove."
            exit 1
          fi
          printf '%s\n' "$resolved" >> "$GITHUB_ENV"
          printf 'toolchain resolved:\n%s\n' "$resolved"

      - name: Resolve the cluster credential from the Infisical SSOT
        env:
          INFISICAL_CI_CLIENT_ID: ${{ secrets.INFISICAL_CI_CLIENT_ID }}
          INFISICAL_CI_CLIENT_SECRET: ${{ secrets.INFISICAL_CI_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_CI_PROJECT_ID }}
        run: |
          set -euo pipefail
          # ONE CREDENTIAL, NOT TWO, AND THIS IS THE REASON.
          #
          # The roller needs kubectl in order to roll. It ALSO needs a substrate
          # census and the pinned digest, and the obvious wiring for those is a CP
          # database DSN — a second credential, with a second lifecycle, naming a
          # host that has to stay correct.
          #
          # It did not stay correct. Measured 2026-08-10:
          #
          #   /shared/controlplane DATABASE_URL   -> host 'cp-postgres-prod', the
          #       DOCKER container (postmaster start 2026-07-25)
          #   /shared/ops-pin-ro CP_PROD_PIN_RO_DSN -> the same docker server
          #       (172.21.0.4), and GRANT-limited to runtime_image_pins, so it
          #       answers "permission denied for table org_substrates" — it cannot
          #       census at all
          #
          # while the control plane that actually serves production runs IN the
          # cluster against controlplane-db-postgres-0 (postmaster start
          # 2026-08-10 10:44). A roller wired to either DSN would read its target
          # list and its digest out of a database the live CP no longer writes to,
          # and today the two happen to AGREE on the tenant digest — so it would
          # look correct right up until a promote landed in one of them.
          #
          # So both go through the SAME kubectl the roll already requires. One
          # credential to rotate, one cluster to be wrong about, and the census
          # cannot silently address a different control plane than the roll.
          # THE INTERPRETER IS PINNED, NOT LOOKED UP. Falling back to a bare
          # `python3` on PATH is exactly what produced `python3: command not
          # found` mid-step; if the preflight did not hand us one, say so.
          if [ -z "${DEPLOY_PYTHON3:-}" ] || [ ! -x "${DEPLOY_PYTHON3:-/nonexistent}" ]; then
            echo "::error::DEPLOY_PYTHON3 is unset or not executable ('${DEPLOY_PYTHON3:-<unset>}') — the toolchain preflight did not run or did not export it. Refusing to fall back to an ambient 'python3'."
            exit 1
          fi
          if [ -z "${KUBECTL:-}" ] || [ ! -x "${KUBECTL:-/nonexistent}" ]; then
            echo "::error::KUBECTL is unset or not executable ('${KUBECTL:-<unset>}') — the toolchain preflight did not run or did not export it."
            exit 1
          fi

          # ── WHY THIS IS NOT A BARE `V="$(...)"` ANYMORE ───────────────────
          #
          # Steps run as `bash --noprofile --norc -e -o pipefail {0}`, and a
          # simple assignment takes the exit status of its command substitution.
          # So `KUBECONFIG_BODY="$(reader)"` KILLS THE STEP THE INSTANT THE
          # READER FAILS — above the `-z` guard written right below it, which
          # therefore never ran and never printed the diagnostic it exists for.
          # That is how run 644986 reported nothing but `command not found`.
          #
          # Capturing the status into `rc` puts the assignment in an OR-list,
          # which `set -e` does not act on, so the value is JUDGED before it is
          # used. `|| true` would be the wrong repair: it converts "the read
          # failed" into "the read returned empty", collapsing two different
          # faults into one and mis-naming whichever actually happened.
          #
          # `optional` mode is passed so a MISSING key returns 10 instead of
          # being flattened into the same exit 1 as an auth or transport error.
          # Both still fail closed — this only decides WHICH sentence gets
          # printed, and "the operator never seeded the secret" and "the read
          # broke" want very different next actions.
          rc=0
          KUBECONFIG_B64="$("$DEPLOY_PYTHON3" .gitea/scripts/infisical-read-secret.py \
            K8S_FLEET_KUBECONFIG /shared/controlplane prod optional)" || rc=$?
          case "$rc" in
            0) ;;
            10)
              echo "::error::K8S_FLEET_KUBECONFIG DOES NOT EXIST at /shared/controlplane (environment 'prod') in the Infisical SSOT. This job's cluster credential was never seeded, so it cannot census or roll anything."
              echo "::error::OPERATOR STEP: seed K8S_FLEET_KUBECONFIG as the BASE64 of a kubeconfig body. Base64 is not decoration — the SSOT reader rejects any value containing a line break, so a raw multi-line kubeconfig cannot be stored under this key at all."
              echo "::error::NOTE: the pre-existing /shared/controlplane KUBECONFIG key is a PATH ('/etc/molecule/cp-prod.kubeconfig') that resolves only inside the molecule-cp-prod container — it is not kubeconfig CONTENT and a CI runner cannot use it."
              exit 1 ;;
            *)
              echo "::error::reading K8S_FLEET_KUBECONFIG from the Infisical SSOT FAILED (reader exit ${rc}); the reader's own ::error:: above says why (auth, transport, or a value the reader refuses such as one containing a line break)."
              echo "::error::Refusing to continue without a cluster credential rather than rolling zero tenants and calling it a deploy."
              exit 1 ;;
          esac
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "::error::Infisical returned EMPTY for K8S_FLEET_KUBECONFIG (/shared/controlplane, prod)."
            echo "::error::A declared-but-empty secret produces exactly the vacuous pass this job exists to stop, so this fails rather than rolling zero tenants."
            exit 1
          fi

          # DECODE, THEN PROVE IT IS A KUBECONFIG BEFORE ANYTHING TRUSTS IT.
          # Writing the raw value straight out would hand kubectl a base64 blob
          # and turn a seeding mistake into an unreadable parse error three steps
          # later. `wc -c > 0` is not evidence of a kubeconfig either — assert
          # that kubectl can PARSE it and name a current context.
          umask 077
          if ! printf '%s' "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/fleet.kubeconfig" 2>/dev/null; then
            echo "::error::K8S_FLEET_KUBECONFIG is not valid base64. Seed it as the base64 encoding of the kubeconfig body (the SSOT reader refuses a raw multi-line value)."
            exit 1
          fi
          ctx=""
          if ! ctx="$("$KUBECTL" --kubeconfig "$RUNNER_TEMP/fleet.kubeconfig" config current-context 2>/dev/null)" \
             || [ -z "$ctx" ]; then
            echo "::error::the decoded K8S_FLEET_KUBECONFIG is not a usable kubeconfig — kubectl cannot read a current-context out of it ($(wc -c < "$RUNNER_TEMP/fleet.kubeconfig") bytes decoded)."
            exit 1
          fi
          echo "KUBECONFIG=$RUNNER_TEMP/fleet.kubeconfig" >> "$GITHUB_ENV"
          echo "kubeconfig materialized ($(wc -c < "$RUNNER_TEMP/fleet.kubeconfig") bytes, context '${ctx}')"

      - name: Resolve the census and the PINNED digest, and prove both are non-empty
        id: resolve
        run: |
          set -euo pipefail
          # `command -v kubectl` is deliberately GONE from here. On this platform
          # that exact check has already passed vacuously: both control planes
          # ship the kubectl BINARY and hold no credentials, so every preflight
          # written as "is the binary there" went green while the capability was
          # absent. The toolchain preflight resolved an absolute, RUNNABLE
          # kubectl; what is still worth proving here — and is not implied by the
          # binary existing — is that it can reach the cluster with the
          # credential this job just materialized.
          if [ -z "${KUBECTL:-}" ] || [ ! -x "${KUBECTL:-/nonexistent}" ]; then
            echo "::error::KUBECTL is unset or not executable ('${KUBECTL:-<unset>}') — the toolchain preflight did not run or did not export it. Refusing to fall back to an ambient 'kubectl'."
            exit 1
          fi
          "$KUBECTL" version -o json >/dev/null 2>&1 || { echo "::error::kubectl ('${KUBECTL}') cannot reach the cluster with the resolved credential"; exit 1; }

          # The census command handed to the roller. Written as a file because
          # SUBSTRATE_CENSUS_CMD is eval'd, and a multi-line SQL string through
          # eval is how quoting bugs become "the fleet is empty".
          cat > "$RUNNER_TEMP/census.sh" <<'CENSUS'
          #!/usr/bin/env bash
          set -euo pipefail
          # $KUBECTL is the absolute path the toolchain preflight resolved and
          # exported; it reaches here through the roller's inherited environment.
          # `:?` rather than a `:-kubectl` default ON PURPOSE — a default would
          # silently put the census back on ambient PATH lookup, which on this
          # runner means `kubectl: not found` inside an eval'd command, surfacing
          # as "the fleet is empty" instead of "the census could not run".
          : "${KUBECTL:?KUBECTL must be exported by the deploy toolchain preflight}"
          exec "$KUBECTL" exec -i -n "$CP_PROD_NAMESPACE" "$CP_PROD_DB_POD" -- \
            psql -U "$CP_PROD_DB_USER" -d "$CP_PROD_DB_NAME" -At -F "$(printf '\t')" -v ON_ERROR_STOP=1 \
            -c "SELECT o.slug, o.id, s.substrate, s.instance_id FROM org_substrates s JOIN organizations o ON o.id = s.org_id ORDER BY o.slug;"
          CENSUS
          # No dedent step here on purpose: YAML has already stripped this block
          # scalar's indentation, so the heredoc body and its CENSUS terminator
          # both arrive at column 0. An earlier revision carried a
          # `sed -i 's/^          //'` "dedent" that matched nothing — a
          # transformation the file implied and never performed.
          chmod +x "$RUNNER_TEMP/census.sh"

          # THE DIGEST COMES FROM runtime_image_pins, WHICH IS THE SSOT FOR WHAT A
          # TENANT RUNS. This workflow previously rolled `--tag latest`, a MOVING
          # tag: two tenants rolled minutes apart can land on different bytes, and
          # neither need match the pin the control plane believes is deployed. A
          # digest is the only thing that makes a roll reproducible and makes a
          # promote mean anything.
          # NO `| head -1` HERE. Under `set -o pipefail`, head closing the pipe as
          # soon as it has its line SIGPIPEs the producer, and a successful query
          # becomes a failed pipeline. This platform has already lost time to
          # exactly that shape (`printf | grep -q` inverting a verdict), and here
          # it would abort the deploy on a query that worked. Capture the whole
          # answer, then take the first line with parameter expansion — no pipe,
          # no signal, and a multi-row answer still cannot slip through because
          # the sha256 shape check below runs on that first line alone.
          # SAME `-e` SHAPE AS THE CREDENTIAL READ, SAME REPAIR. A bare
          # `digest_raw="$(kubectl exec ...)"` dies on the assignment the moment
          # the exec or the query fails, ABOVE the sha256 shape check below —
          # so a broken query would surface as a bare psql/kubectl line and the
          # carefully-worded "refusing to fall back to a moving tag" diagnostic
          # would never print. Capture the status, judge it, THEN use the value.
          digest_rc=0
          digest_raw="$("$KUBECTL" exec -i -n "$CP_PROD_NAMESPACE" "$CP_PROD_DB_POD" -- \
            psql -U "$CP_PROD_DB_USER" -d "$CP_PROD_DB_NAME" -At -v ON_ERROR_STOP=1 \
            -c "SELECT image_digest FROM runtime_image_pins WHERE template_name='molecule-tenant' AND region='global';")" || digest_rc=$?
          if [ "$digest_rc" -ne 0 ]; then
            echo "::error::the pinned-digest query FAILED (exit ${digest_rc}) against ${CP_PROD_NAMESPACE}/${CP_PROD_DB_POD}. That is a fault in this job's access to the control-plane database, NOT a statement about what production is pinned to."
            exit 1
          fi
          K8S_TENANT_DIGEST="$(printf '%s' "${digest_raw%%$'\n'*}" | tr -d '[:space:]')"
          case "$K8S_TENANT_DIGEST" in
            sha256:[0-9a-f]*) : ;;
            *)
              echo "::error::runtime_image_pins has no usable molecule-tenant/global digest (got '${K8S_TENANT_DIGEST}')."
              echo "::error::Refusing to fall back to a moving tag — that is how a 'successful' roll lands bytes nobody pinned."
              exit 1 ;;
          esac
          echo "::notice::pinned tenant digest = ${K8S_TENANT_DIGEST}"
          echo "digest=$K8S_TENANT_DIGEST" >> "$GITHUB_OUTPUT"

          # PROVE THE CENSUS RETURNS ROWS BEFORE HANDING IT OVER. The roller has
          # its own zero-row refusal, but a census broken HERE surfaces there as
          # "the fleet is empty", which reads like a fact about production rather
          # than a fact about this wiring.
          # RUN IT ONCE AND COUNT THE FILE. An earlier revision invoked the census
          # once per count, so a single job made three separate exec-into-Postgres
          # round trips against the LIVE production control plane to answer two
          # questions. It also meant the numbers reported and the fleet rolled
          # could, in principle, come from different reads.
          "$RUNNER_TEMP/census.sh" > "$RUNNER_TEMP/census.tsv"
          rows="$(grep -c . "$RUNNER_TEMP/census.tsv" || true)"
          k8s_rows="$(awk -F'\t' '$3=="k8s"' "$RUNNER_TEMP/census.tsv" | grep -c . || true)"
          echo "::notice::census: rows=${rows} k8s=${k8s_rows}"
          if [ "${rows:-0}" -eq 0 ]; then
            echo "::error::the substrate census returned ZERO rows. A control plane that knows about no tenants on any substrate is a broken query or the wrong database, not an empty fleet."
            exit 1
          fi
          if [ "${k8s_rows:-0}" -eq 0 ]; then
            echo "::error::the census found ${rows} org(s) and NONE on the k8s substrate, so this job would roll nothing — the exact vacuous pass it replaces."
            exit 1
          fi
          echo "census=$RUNNER_TEMP/census.sh" >> "$GITHUB_OUTPUT"

      - name: Roll the k8s tenant fleet (plan-only while the freeze is on)
        env:
          SUBSTRATE_CENSUS_CMD: ${{ steps.resolve.outputs.census }}
          PINNED_DIGEST: ${{ steps.resolve.outputs.digest }}
          DRY: ${{ steps.mode.outputs.dry }}
        run: |
          set -euo pipefail
          # --allow-empty is deliberately NOT passed. An empty k8s fleet is only
          # ever acceptable as an explicit operator assertion, and the step above
          # has just proven this fleet is not empty.
          args="--digest $PINNED_DIGEST"
          if [ "$DRY" = "1" ]; then args="$args --dry-run"; fi

          # 2>&1 IS LOAD-BEARING, AND ITS ABSENCE WAS A SHIPPING DEFECT.
          #
          # The roller writes its ENTIRE human-readable output to stderr: log() is
          # `printf ... >&2`, the SUMMARY line goes through log(), and the
          # before/after table is a `{ ... } >&2` group. A plain `| tee` captures
          # stdout only, so roll.log was ZERO BYTES, the SUMMARY grep below found
          # nothing, and this step exited 1 on EVERY run.
          #
          # The frozen path would merely have been a confusing red. The un-frozen
          # path is the dangerous one: the roller would have rolled the production
          # fleet, exited 0, and then this workflow would have declared the deploy
          # FAILED — inviting someone to re-run or roll back a roll that had
          # already succeeded. A false "deploy failed" on a successful fleet roll
          # is a worse signal than no signal.
          #
          # It also self-triggers: this workflow's paths: filter includes its own
          # file, so merging the change that introduced it is the push that
          # produces the first red.
          #
          # `|| rc=$?` rather than bare pipefail-plus-set-e, so a roller failure
          # does not abort this step before it can report WHICH failure it was.
          rc=0
          # shellcheck disable=SC2086
          bash scripts/deploy/redeploy-tenant-fleet-k8s.sh $args 2>&1 | tee "$RUNNER_TEMP/roll.log" || rc=$?

          # CAPTURED NOTHING IS ITS OWN FAILURE, named separately from "the roll
          # failed". Conflating them is how the defect above stayed invisible: an
          # empty log and a genuine rollout failure both surfaced as "no SUMMARY".
          if [ ! -s "$RUNNER_TEMP/roll.log" ]; then
            echo "::error::the roller produced NO captured output at all (roll.log is 0 bytes). This step cannot see what happened to production, which is a reporting fault in THIS workflow — check the stdout/stderr redirection before concluding anything about the fleet."
            exit 1
          fi

          # THE COUNTS ARE THE VERDICT. The script prints a SUMMARY line; surface
          # it, and refuse a run whose result cannot be read at all.
          summary="$(grep -E 'SUMMARY ' "$RUNNER_TEMP/roll.log" | tail -1 || true)"
          if [ "$rc" -ne 0 ]; then
            echo "::error::the k8s fleet roll FAILED (exit ${rc}). ${summary:-<no SUMMARY line was emitted>}"
            exit "$rc"
          fi
          if [ -z "$summary" ]; then
            echo "::error::the roller exited 0 but emitted no SUMMARY line, so this run cannot say how many tenants it touched. An unreadable result is a failure, not a pass."
            exit 1
          fi
          {
            if [ "$DRY" = "1" ]; then
              echo "## Production k8s tenant fleet — PLAN ONLY (production freeze is on)"
            else
              echo "## Production k8s tenant fleet — ROLLED"
            fi
            echo ""
            echo "- Pinned digest: \`${PINNED_DIGEST}\`"
            echo "- \`${summary}\`"
          } >> "$GITHUB_STEP_SUMMARY"
