name: promote-prod-tenant-pin

# PRODUCTION molecule-tenant pin promotion as a REVIEWED PIPELINE STEP, replacing
# a hand-run `curl POST /cp/admin/runtime-image/promote` from an operator laptop.
#
# WHAT WAS THERE BEFORE. Template repos auto-promote the STAGING pin from
# publish-image.yml, deliberately staging-only ("Production pin changes require a
# separate reviewed control-plane change"). For PRODUCTION there was no pipeline
# at all: no core workflow ever POSTs to /cp/admin/runtime-image/promote, and
# every core workflow's CP host is staging-api. The prod path was two hand-run
# steps — the curl, and a separate hand-edit of the prod Infisical
# LOCAL_TENANT_IMAGE secret. Missing the second is documented as the exact way
# "prod broke every fresh org", and on 2026-08-05 it was drifted again: prod
# LOCAL_TENANT_IMAGE pointed at `staging-7d78136`, a tag that returns 404 on BOTH
# registry hosts.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE WAS REWRITTEN (2026-08-08, issue #5123)
#
# The lane had never completed a single run. Its one and only run, 624317, has
# `started_at: 1970-01-01T00:00:00Z` — epoch zero, i.e. no runner ever picked it
# up — and was eventually cancelled. Three concrete defects, all fixed here:
#
# 1. UNSCHEDULABLE. `runs-on: [docker-host, local-deploy]` is an AND over labels.
#    Of the 29 registered runners, 22 carry `docker-host` and none of those
#    carries `local-deploy`; the 5 `local-deploy-deploy-runner-*` pods carry
#    exactly ['local-deploy'] and nothing else. The intersection is EMPTY.
#    Relabelling alone cannot fix it, because the job needed docker (the pin
#    script's resolve_digest() did `docker pull`) AND a route to the prod CP.
#    FIX: the docker DEPENDENCY is removed — scripts/deploy/advance-staging-tenant-pin.sh
#    now takes DIGEST_SOURCE=registry and resolves the digest over the registry
#    HTTP API via .gitea/scripts/registry-manifest-state.py.
#
#    WHY `docker-host` AND NOT `local-deploy`. The obvious single label was
#    `local-deploy`, matching redeploy-tenants-on-main.yml. That was tried and it
#    FAILS — measured, not guessed. Run 634105 on this branch was scheduled onto
#    local-deploy-deploy-runner-5685894b6b-mdtvd (so the label fix itself worked:
#    started_at was real, not epoch zero) and died at the digest step with
#        python3: command not found
#    The local-deploy pod image is minimal. That is fatal for this lane well
#    beyond one step: registry-manifest-state.py, prod_pin_plan.py and the eight
#    python3 calls inside advance-staging-tenant-pin.sh are all unavailable there.
#    `local-deploy` exists to hold a runner-configured mTLS Docker endpoint, which
#    this lane does not use at all.
#
#    `docker-host` is correct because defect 2 below removes the only reason the
#    lane ever needed local-deploy: the control planes answer over public HTTPS,
#    not loopback. docker-host runners are full ubuntu-22.04 images that run
#    python3 throughout CI today, and 22 of them are online versus ONE local-deploy
#    pod — so this also removes a single-runner queue-forever hazard, which is
#    worth stating because `timeout-minutes` bounds execution, not queue time.
#    This job uses no docker; being ON docker-host is simply where the tooling is.
#
# 2. THE CP IS NOT ON LOOPBACK. The old default was
#    PROD_CP_BASE_URL=http://127.0.0.1:8092. The `local-deploy` runners are k8s
#    pods that reach the production Docker daemon over a runner-configured mTLS
#    tcp:// endpoint (see scripts/deploy/require-local-deploy-daemon.sh); they are
#    NOT on the prod box and have no loopback route to it. Verified 2026-08-08 by
#    reading the same pin over both paths:
#        https://api.moleculesai.app          == 127.0.0.1:8092  (molecule-cp-prod)
#        https://staging-api.moleculesai.app  == 127.0.0.1:8096  (molecule-cp-staging)
#    Both control planes answer over public HTTPS, so that is what is used here.
#
# 3. SINGLE-CP, THEREFORE HALF-BLIND. The production fleet is split across TWO
#    control-plane databases; tenants are assigned by their `cp-env` label. On
#    2026-08-08 the two disagreed:
#        cp_prod     molecule-tenant  sha256:747d3df6…  git f3c9eaf244…
#        cp_staging  molecule-tenant  sha256:f1972d8c…  git 1802ebe22…
#    A promote against one endpoint returns 200 while the reconciler reports the
#    out-of-scope tenants converged AGAINST THEIR OWN PIN — the miss is silent and
#    looks exactly like success. Every endpoint in PROD_CP_BASE_URLS is now read,
#    and .gitea/scripts/prod_pin_plan.py fails closed if the
#    (molecule-tenant, global) row is absent from ANY of them.
#
# CREDENTIAL. The plan READS the live pin (`GET /cp/admin/runtime-image`), so it
# needs a read-capable credential. `CP_PROMOTE_PROD_API_TOKEN` — the documented
# least-privilege promote capability — is accepted ONLY for
# `POST /cp/admin/promote` and `POST /cp/admin/runtime-image/promote`; verified
# 2026-08-08 that it returns 401 on the GET, and 401 on EVERY route of the
# second control plane (its capability is enabled only where the canonical
# environment is `production`). So it cannot drive this lane. The token is read
# from the Infisical SSOT at run time — prod env, /shared/controlplane-admin —
# using the existing INFISICAL_CI_* machine identity, exactly the way
# staging-tenant-cd.yml does. NOTE the env slug is `prod`, not `production`.
# Deliberately NOT minted as a second long-lived Gitea Actions secret.
#
# THIS DOES NOT ARM AUTO-DEPLOY. Read this before changing the gating:
#   * There is NO push trigger. Dispatch only. Merging cannot promote prod.
#   * The APPLY path additionally requires BOTH:
#       - PROD_AUTO_DEPLOY_DISABLED unset/false (the existing freeze is HONOURED,
#         never bypassed — this lane is not a side door around it), and
#       - PROD_TENANT_PIN_PROMOTE_ARMED == 'true' (a second, explicit arming
#         switch that is intentionally NOT provisioned).
#     Both must be true. Under the current freeze posture the apply path cannot
#     run, which is the intended state and is UNCHANGED by this rewrite.
#   * The DEFAULT path is PLAN-ONLY and needs neither. It resolves the target
#     digest, reads the live pin back from EVERY control plane, and prints the
#     exact diff — an auditable, reviewable plan, with no mutation.
# "Via CI" here means a gated, reviewed, auditable step. It does not mean deploy
# on merge, and this file must not be edited into meaning that.
#
# A pin promote changes what FRESH provisions get; it does not roll running
# workspaces (Guard E converges those separately), and native plugin versions are
# compiled INTO the tenant binary, so a pin promote alone ships no plugin change.
#
# REGISTRY HOST — a live mismatch an operator must decide about, NOT fixed here.
# As of 2026-08-08 the production boot SSOT reads
#     LOCAL_TENANT_IMAGE = registry.enteros.ai/molecule-ai/molecule-tenant:staging-f3c9eaf
# i.e. the `registry.enteros.ai` host, while TENANT_IMAGE below defaults to the
# canonical `registry.moleculesai.app`. Both hosts serve byte-identical digests
# (verified for staging-f3c9eaf and staging-1802ebe), so the two refs are
# equivalent TODAY. Two consequences worth knowing before arming the apply path:
#   * .gitea/scripts/registry-manifest-state.py pins CANONICAL_REGISTRY to
#     registry.moleculesai.app and REJECTS an enteros.ai ref outright. Setting the
#     MOLECULE_TENANT_IMAGE var to the enteros.ai host makes the digest step fail
#     closed — deliberately, but surprisingly.
#   * The apply path records TENANT_IMAGE verbatim into LOCAL_TENANT_IMAGE, so
#     running it with the default REWRITES the prod boot default from the
#     enteros.ai host to the moleculesai.app host.
#   * Put those two together and the consequence is not optional: because the
#     resolver refuses the enteros host, there is NO configuration in which this
#     lane both plans AND applies against enteros.ai. ARMING THEREFORE FORCES THE
#     HOST REWRITE. It is content-equivalent and pull-equivalent — both hosts
#     serve byte-identical digests for both tags and the prod box holds auths for
#     both — but it is a real edit to the boot SSOT and must be a decision, not a
#     surprise.
#
# DIGEST SOURCES ARE NOT INTERCHANGEABLE. `DIGEST_SOURCE=docker` returns
# `docker image inspect {{.Id}}`, which is the image CONFIG digest;
# `DIGEST_SOURCE=registry` returns the MANIFEST digest. They are different values
# in general. They agree here only because every live pin was written as a
# manifest digest (verified for both tags on both control planes). If some future
# path ever writes a config digest into runtime_image_pins, this lane's plan would
# read that row as permanently "PROMOTE REQUIRED" and never converge. Only the
# manifest digest is pullable as `<name>@sha256:<digest>`, so it is the correct
# one; the point is that the two sources must not be mixed within one pin's
# history.
#
# NO workflow_dispatch inputs (lint-workflow-yaml forbids them). The target is
# DERIVED: the molecule-tenant image for the NEWEST FIRST-PARENT TRUNK COMMIT THE
# REGISTRY ACTUALLY SERVES, i.e. `<TENANT_IMAGE>:staging-<sha7>` for that commit.
# That is deliberate — it makes "promote prod" mean "promote what trunk says",
# and removes the footgun of dispatching an arbitrary tag.
#
# It used to be main HEAD exactly, and that made the lane unrunnable: see the
# comment on the target step for run 637861's log lines. Most main commits build
# no tenant image (the publish lane is path-filtered) and old tags are pruned.
#
# PROVENANCE. The apply path's pin write is stamped by
# .gitea/scripts/pin_provenance.py, which mints from GITHUB_RUN_ID and therefore
# CANNOT be minted outside a run. `promoted_by` cannot carry that signal — it
# renders as the CP admin token's identity (`api-token-<8 hex>`) whether the
# caller is this job or an operator holding the same token. pin-provenance-guard
# audits the live rows against it.
#
# It SHELLS OUT to scripts/deploy/advance-staging-tenant-pin.sh rather than
# re-implementing the promote. That script already writes BOTH SSOTs (the
# runtime_image_pins DB row AND the LOCAL_TENANT_IMAGE boot secret) and verifies
# each write landed; it is env-parameterised, so prod is a matter of CP_BASE_URL
# + INFISICAL_ENV, not a second copy of the logic.

on:
  workflow_dispatch:

env:
  GITHUB_SERVER_URL: https://git.moleculesai.app

permissions:
  contents: read

concurrency:
  group: promote-prod-tenant-pin
  cancel-in-progress: false

jobs:
  # bp-exempt: dispatch-only production promote lane, emits no PR/push context
  promote:
    name: Promote the production molecule-tenant pin
    runs-on: docker-host
    timeout-minutes: 30
    env:
      PROD_AUTO_DEPLOY_DISABLED: ${{ vars.PROD_AUTO_DEPLOY_DISABLED || secrets.PROD_AUTO_DEPLOY_DISABLED || '' }}
      PROMOTE_ARMED: ${{ vars.PROD_TENANT_PIN_PROMOTE_ARMED || '' }}
      TENANT_IMAGE: ${{ vars.MOLECULE_TENANT_IMAGE || 'registry.moleculesai.app/molecule-ai/molecule-tenant' }}
      # Comma-separated <label>=<base_url>=<infisical_env>, one entry per
      # control-plane database that serves production tenants. BOTH are required
      # for a complete picture; see defect 3 in the header.
      #
      # The Infisical env is part of the ENDPOINT, not a job-wide constant: it
      # selects which LOCAL_TENANT_IMAGE boot secret gets written, and each
      # control plane resolves that secret from its own environment. See
      # .gitea/scripts/prod_cp_endpoints.py.
      PROD_CP_BASE_URLS: ${{ vars.PROD_CP_BASE_URLS || 'cp_prod=https://api.moleculesai.app=prod,cp_staging=https://staging-api.moleculesai.app=staging' }}
      INFISICAL_BASE: https://key.moleculesai.app
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Resolve the NEWEST TRUNK COMMIT THE REGISTRY ACTUALLY SERVES, not
      # blindly `main` HEAD.
      #
      # This was measured, not anticipated. The first dispatch of this lane from
      # main after the multi-CP rewrite — run 637861, 2026-08-09 — died here:
      #
      #   ::notice::target = registry.moleculesai.app/molecule-ai/molecule-tenant:staging-b7508a4 (main b7508a4abce6169e619081b0e531e5df6f92bf0c)
      #   ::error::the registry serves NO manifest for registry.moleculesai.app/molecule-ai/molecule-tenant:staging-b7508a4. …Refusing.
      #
      # `staging-<sha7(main HEAD)>` only exists if a tenant image was published
      # for exactly that commit AND has not been pruned. Neither holds in
      # general: publish-workspace-server-image.yml is path-filtered so most
      # main commits build no tenant image at all, and the repository keeps a
      # short tail (20 `staging-*` tags at the time of writing; b7508a4 was
      # never among them while b5e48f0, three commits older, was). So the lane
      # was structurally red at almost any moment someone might dispatch it —
      # a promote path you cannot run is not a promote path.
      #
      # Walking back is NOT a weakening of "promote what trunk says": every
      # candidate is a first-parent commit of origin/main, so the target is
      # still a trunk commit and still cannot be an arbitrary tag. It is the
      # newest trunk commit that HAS an image. The 404 refusal is kept for the
      # case that matters — if NOTHING in the window is served, this fails
      # closed rather than promoting a pin to a tag nobody can pull, which is
      # exactly how prod was left on staging-7d78136.
      - name: Resolve the target — newest trunk commit the registry serves
        id: target
        env:
          REG_USER: ${{ vars.MOLECULE_REGISTRY_USER || 'hongming' }}
          REG_TOKEN: ${{ secrets.MOLECULE_REGISTRY_TOKEN }}
          # How far back down trunk to look. 40 first-parent commits is several
          # days of merges; beyond that the right answer is "publish an image",
          # not "promote something ancient".
          TRUNK_SCAN_DEPTH: ${{ vars.PROD_TENANT_PIN_SCAN_DEPTH || '40' }}
        run: |
          set -euo pipefail
          if [ -z "${REG_TOKEN:-}" ]; then
            echo "::error::MOLECULE_REGISTRY_TOKEN is not provisioned — cannot resolve the target digest."
            exit 1
          fi
          echo "::add-mask::$REG_TOKEN"
          head_sha="$(git rev-parse origin/main)"
          echo "::notice::trunk head = ${head_sha}; scanning up to ${TRUNK_SCAN_DEPTH} first-parent commit(s) for a served tenant image"
          found_sha=""
          found_digest=""
          scanned=0
          skipped=""
          for sha in $(git rev-list --first-parent --max-count="${TRUNK_SCAN_DEPTH}" origin/main); do
            scanned=$((scanned + 1))
            ref="${TENANT_IMAGE}:staging-${sha:0:7}"
            set +e
            digest="$(python3 .gitea/scripts/registry-manifest-state.py "$ref")"
            rc=$?
            set -e
            if [ "$rc" = "0" ] && [ -n "$digest" ]; then
              found_sha="$sha"
              found_digest="$digest"
              break
            fi
            if [ "$rc" != "10" ]; then
              # rc 10 is the ONLY "this tag is simply not published" answer. Any
              # other failure is a registry/credential problem, and continuing
              # would walk silently past a broken read and promote an older
              # image as though trunk had chosen it.
              echo "::error::registry read for ${ref} failed with rc=${rc} — that is not a 'tag absent' answer. Refusing to keep walking past an unread registry."
              exit 1
            fi
            skipped="${skipped} ${sha:0:7}"
          done
          if [ -z "$found_sha" ]; then
            echo "::error::no tenant image is published for ANY of the last ${scanned} trunk commit(s):${skipped}. Promoting a pin to a tag the registry does not serve is exactly how prod was left on staging-7d78136 (404 on both registry hosts). Refusing. Publish a tenant image for a trunk commit first (publish-workspace-server-image.yml)."
            exit 1
          fi
          if [ "$found_sha" != "$head_sha" ]; then
            behind="$(git rev-list --count "${found_sha}..${head_sha}")"
            echo "::warning::trunk HEAD ${head_sha:0:7} has no published tenant image; the target is the newest trunk commit that does — ${found_sha:0:7}, ${behind} commit(s) behind HEAD. Skipped:${skipped}"
          fi
          echo "sha=${found_sha}"          >> "$GITHUB_OUTPUT"
          echo "sha7=${found_sha:0:7}"     >> "$GITHUB_OUTPUT"
          echo "tag=staging-${found_sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "digest=${found_digest}"    >> "$GITHUB_OUTPUT"
          echo "::notice::target = ${TENANT_IMAGE}:staging-${found_sha:0:7} (trunk ${found_sha})"
          echo "::notice::target digest = ${found_digest}"

      - name: Read the production CP admin token from the Infisical SSOT
        id: cptoken
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CI_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CI_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_CI_PROJECT_ID }}
        run: |
          set -euo pipefail
          for v in INFISICAL_CLIENT_ID INFISICAL_CLIENT_SECRET INFISICAL_PROJECT_ID; do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then
              echo "::error::$v is not provisioned — this lane reads the prod CP admin token from Infisical rather than holding a second long-lived copy as a Gitea secret. Failing closed."
              exit 1
            fi
          done
          tok="$(curl -fsS -A curl/8.4.0 -X POST "$INFISICAL_BASE/api/v1/auth/universal-auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$INFISICAL_CLIENT_ID\",\"clientSecret\":\"$INFISICAL_CLIENT_SECRET\"}" \
            | python3 -c 'import sys,json; sys.stdout.write(json.load(sys.stdin).get("accessToken") or "")')"
          if [ -z "$tok" ]; then
            echo "::error::Infisical auth returned an empty accessToken — failing closed."
            exit 1
          fi
          echo "::add-mask::$tok"
          # env slug is `prod`, NOT `production`. A promote once wrote to a
          # nonexistent environment because of exactly that confusion.
          cp_token="$(curl -fsS -A curl/8.4.0 \
            "$INFISICAL_BASE/api/v3/secrets/raw/CP_ADMIN_API_TOKEN?workspaceId=$INFISICAL_PROJECT_ID&environment=prod&secretPath=%2Fshared%2Fcontrolplane-admin" \
            -H "Authorization: Bearer $tok" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); sys.stdout.write(((d.get("secret") or {}).get("secretValue")) or "")')"
          if [ -z "$cp_token" ]; then
            echo "::error::Infisical returned an EMPTY CP_ADMIN_API_TOKEN at prod /shared/controlplane-admin — failing closed rather than reporting a plan this lane never produced."
            exit 1
          fi
          echo "::add-mask::$cp_token"
          echo "CP_ADMIN_API_TOKEN=$cp_token" >> "$GITHUB_ENV"
          echo "prod CP admin token loaded from the Infisical SSOT (len=${#cp_token})"

      - name: Plan — current pin vs target on EVERY control plane (no mutation)
        env:
          TAG: ${{ steps.target.outputs.tag }}
          TARGET_DIGEST: ${{ steps.target.outputs.digest }}
        run: |
          set -euo pipefail
          # FAIL-CLOSED. The plan IS the default path's entire product. Without a
          # readable pin none of it happens, so a warn-and-exit-0 would make a
          # dispatch that read nothing indistinguishable from one that confirmed
          # prod was already on trunk — the vacuous-green shape sdk-pin-bump
          # carried (run 620174, 2026-08-05).
          #
          # Failing here is safe and cannot wedge anything: this lane is
          # dispatch-only and posts no commit status on any PR, and going red on
          # the PLAN step can never promote — the apply step is separately gated.
          if [ -z "${CP_ADMIN_API_TOKEN:-}" ]; then
            echo "::error::CP_ADMIN_API_TOKEN is empty after the Infisical read — refusing to plan."
            exit 1
          fi
          args=()
          # prod_cp_endpoints.py owns the endpoint grammar and fails closed on a
          # malformed or unknown-environment entry, so a half-parsed table can
          # never silently drop a control plane.
          endpoints="$(python3 .gitea/scripts/prod_cp_endpoints.py "$PROD_CP_BASE_URLS")"
          while IFS=$'\t' read -r label base inf_env; do
            [ -n "$label" ] || continue
            resp="${RUNNER_TEMP:-/tmp}/pins-${label}.json"
            # lint-curl-status-capture shape: body to a file, status to a var, no
            # or-else fallback inside the subshell.
            code=$(curl -sS -A curl/8.4.0 -o "$resp" -w '%{http_code}' \
              -H "Authorization: Bearer ${CP_ADMIN_API_TOKEN}" \
              "${base%/}/cp/admin/runtime-image")
            if [ "$code" != "200" ]; then
              echo "::error::[${label}] could not read the live pin at ${base} (HTTP $code)"
              exit 1
            fi
            # An empty 200 body is a KNOWN silent-failure shape on this path.
            if [ ! -s "$resp" ]; then
              echo "::error::[${label}] CP returned HTTP 200 with an EMPTY body — that is the known silent-failure shape, not an empty pin set. Refusing to plan against it."
              exit 1
            fi
            args+=("${label}=${resp}")
          done <<< "$endpoints"
          if [ "${#args[@]}" -lt 2 ]; then
            echo "::warning::planning against ${#args[@]} control plane(s). Production tenants are split across TWO CP databases; a single-endpoint plan is true for at most half the fleet."
          fi
          python3 .gitea/scripts/prod_pin_plan.py \
            --target "${TENANT_IMAGE}:${TAG}" \
            --target-digest "${TARGET_DIGEST}" \
            --needed-out "${RUNNER_TEMP:-/tmp}/needed.txt" \
            "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Decide plan vs apply
        id: mode
        run: |
          set -euo pipefail
          frozen=0
          case "$(printf '%s' "${PROD_AUTO_DEPLOY_DISABLED:-}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|on|disabled|disable) frozen=1 ;;
          esac
          armed=0
          [ "$(printf '%s' "${PROMOTE_ARMED:-}" | tr '[:upper:]' '[:lower:]')" = "true" ] && armed=1
          if [ "$frozen" = "1" ]; then
            echo "::notice::PROD_AUTO_DEPLOY_DISABLED is set — production freeze HONOURED. Plan only, no mutation."
            echo "apply=0" >> "$GITHUB_OUTPUT"
          elif [ "$armed" = "0" ]; then
            echo "::notice::PROD_TENANT_PIN_PROMOTE_ARMED is not 'true' — plan only, no mutation."
            echo "apply=0" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::APPLY path enabled: freeze is off AND the lane is armed. This WILL mutate the production pin and the LOCAL_TENANT_IMAGE boot SSOT."
            echo "apply=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply — promote BOTH SSOTs on EVERY control plane and read back
        if: ${{ steps.mode.outputs.apply == '1' }}
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CI_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CI_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_CI_PROJECT_ID }}
          DIGEST_SOURCE: registry
          REG_USER: ${{ vars.MOLECULE_REGISTRY_USER || 'hongming' }}
          REG_TOKEN: ${{ secrets.MOLECULE_REGISTRY_TOKEN }}
          # The SCRIPT reads TENANT_IMAGE_NAME; TENANT_IMAGE is only this job's
          # variable. Without this hand-off the script falls back to its own
          # hardcoded repository, so a set `vars.MOLECULE_TENANT_IMAGE` would have
          # the plan and the digest computed for one repository while the apply
          # mutated a different one. staging-tenant-cd.yml passes it the same way.
          TENANT_IMAGE_NAME: ${{ env.TENANT_IMAGE }}
          TENANT_PIN_GIT_SHA: ${{ steps.target.outputs.sha }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          # The existing script is the SSOT for how a promote is done: it writes
          # the runtime_image_pins row AND the LOCAL_TENANT_IMAGE boot secret,
          # and verifies each landed. Re-implementing it here is how the two
          # halves drift apart again.
          #
          # GATE ON THE PLAN'S OWN VERDICT. Arming is sticky and repo-scoped, and
          # lint-workflow-yaml forbids dispatch inputs, so there is no per-run
          # confirmation: without this an armed operator who dispatches wanting
          # only a plan gets a fleet-global mutation. If the plan found nothing to
          # promote anywhere, do nothing.
          needed_file="${RUNNER_TEMP:-/tmp}/needed.txt"
          if [ ! -f "$needed_file" ]; then
            echo "::error::the plan step wrote no verdict file — refusing to apply against an unknown plan."
            exit 1
          fi
          if [ ! -s "$needed_file" ]; then
            echo "::notice::the plan found every control plane already at the target digest — nothing to promote, so the apply is a no-op."
            echo "KNOWN LIMITATION: this gate keys on the runtime_image_pins digest only. If every DB pin is current but a LOCAL_TENANT_IMAGE boot secret has drifted, this skips the reconciliation that would fix it. Reconcile that case by running scripts/deploy/advance-staging-tenant-pin.sh directly for the affected control plane."
            exit 0
          fi
          echo "::notice::plan says these control planes need the promote: $(tr '\n' ' ' < "$needed_file")"
          #
          # Once per control plane, and each one carries its OWN Infisical
          # environment. INFISICAL_ENV drives BOTH the CP-admin token read AND
          # the LOCAL_TENANT_IMAGE write, and those boot secrets are per control
          # plane (molecule-cp-prod resolves `prod`, molecule-cp-staging resolves
          # `staging`). Setting it once outside this loop promotes the second CP's
          # DB pin and then rewrites the FIRST one's boot secret — silently, since
          # write_ssot_pin re-reads the value it already wrote and logs `SSOT ok`.
          endpoints="$(python3 .gitea/scripts/prod_cp_endpoints.py "$PROD_CP_BASE_URLS")"
          while IFS=$'\t' read -r label base inf_env; do
            [ -n "$label" ] || continue
            echo "::group::promote on ${label} (${base}, infisical env ${inf_env})"
            CP_BASE_URL="${base}" INFISICAL_ENV="${inf_env}" \
              ./scripts/deploy/advance-staging-tenant-pin.sh \
                --tag "${TAG}" --git-sha "${TENANT_PIN_GIT_SHA}"
            echo "::endgroup::"
          done <<< "$endpoints"
