# main-red-watchdog — sentinel for post-merge CI red on `main`.
#
# ⚠️  THIS WORKFLOW IS NOT CURRENTLY FIRING. It has no `schedule:` (the repo
# runs a zero-cron ratchet) and — unlike status-reaper and
# stranded-status-janitor — no operator-config cron entry is wired for it.
# See the `on:` block below for the measurement and the missing wiring.
#
# RFC: hongming "main NEVER goes red" directive, Option C of the four-
# option ladder (B = auto-revert is explicitly rejected per
# `feedback_no_such_thing_as_flakes` + `feedback_fix_root_not_symptom`).
# Tracking issue: molecule-core#420.
#
# What it does:
#   1. GET branches/main → HEAD SHA
#   2. GET commits/{SHA}/status → combined status
#   3. If combined is `failure` (or any individual status is `failure`):
#      open or PATCH an idempotent `[main-red] {repo}: {SHA[:10]}` issue
#      with each failed context + target_url + description.
#   4. If combined is `success` and a prior `[main-red] ...` issue exists,
#      close it with a "main returned to green at SHA ..." comment.
#   5. Emit a Loki-shaped JSON line via `logger -t main-red-watchdog` for
#      `reference_obs_stack_phase1` ingestion via Vector.
#
# What it does NOT do:
#   - Auto-revert anything. Option B is rejected by directive.
#   - Mutate branch protection. (See AGENTS.md boundaries.)
#   - Fail the workflow on red. The issue IS the alarm — failing the
#     watchdog would create a silent-loop where a flake in the watchdog
#     itself hides actual main-red signal. Exit 0 unless api() raises
#     ApiError (transient Gitea outage → fail loudly per
#     `feedback_api_helper_must_raise_not_return_dict`).
#
# Pattern source: molecule-controlplane `0adf2098`'s ci-required-drift.yml
# (just merged 2026-05-11). Same shape (cron + dispatch + sidecar Python +
# idempotent-by-title issue), simpler scope (1 source, not 3).

name: main-red-watchdog

on:
  # HISTORY. This block used to read "SCHEDULE RE-ENABLED 2026-05-12 rev3".
  # That claim was FALSE and had been false for 47 days when it was corrected:
  # the line directly below it declares `workflow_dispatch:` and nothing else.
  # The 2026-06-27 zero-cron sweep (#3344, ratcheted by
  # .gitea/scripts/lint_schedule_budget.py) stripped `schedule:` from this
  # workflow and left the re-enabled comment in place. A reader — human or
  # agent — checking "is main being watched?" read the comment, not the trigger.
  #
  # MEASURED 2026-08-13, not inferred:
  #   * The complete `?event=workflow_dispatch` run history the Gitea API
  #     returns for this repo is 368 runs. `main-red-watchdog.yml` appears
  #     ZERO times in it. `workflow_dispatch` is this workflow's ONLY trigger,
  #     so it has not executed at all in that window.
  #   * The last `[main-red] …` issue this workflow ever filed is #3333,
  #     created 2026-06-27T13:07:20Z. The `[main-red]` series before it lands
  #     at :07 past the hour — a real hourly cron — and then stops dead on the
  #     sweep date. Nothing has filed one since.
  #   * The Gitea Actions API reports this workflow `active`. `active` means
  #     "not disabled_manually". It is NOT evidence that anything runs it.
  #
  # WHAT IS AND IS NOT COVERED WHILE THIS IS DARK. main-canary DOES fire on
  # push:main and DOES file `[main-canary] …` issues, so Go build/vet/test
  # breakage on merged main is still caught. main-canary does NOT read main's
  # COMBINED STATUS, so a red or stranded-pending context on main — a lint, an
  # e2e lane, a zombie-reaped job (#5122), a cross-run stranded pending (#5044)
  # — is seen by nothing. That is the live gap; do not read a green
  # main-canary as "main is green".
  #
  # TO RESTORE. Do NOT add `schedule:` here — lint_schedule_budget.py fails the
  # build on any live `on.schedule`, by directive. Cadence belongs in
  # operator-config, exactly as this workflow's two siblings already document:
  #   /etc/cron.d/molecule-core-main-red-watchdog ->
  #   /usr/local/bin/molecule-core-cron-bot.sh main-red-watchdog
  # An hourly cadence matches the historical `[main-red]` issue series. NOTE
  # that status-reaper and stranded-status-janitor document that same wiring
  # and ALSO appear zero times in the 368-run census above, so installing the
  # cron file is necessary but has NOT been shown sufficient — verify by
  # observing a run, not by observing the config.
  #
  # Repository policy keeps this dispatch flat (no `inputs:`) until shared
  # callers and lint fixtures are migrated together.
  #
  # Job-level timeout-minutes is 15 (rev3, 2026-05-12, mc#645 revert) to absorb
  # runner-saturation latency without spurious cancels.
  workflow_dispatch:

# Read commit status + branch ref + issues; write issues (open/PATCH/close).
permissions:
  contents: read
  issues: write

# Workflow-scoped serialisation — two simultaneous runs would race on the
# `[main-red] {SHA}` open/PATCH path. Idempotent by title, but parallel
# POSTs can produce duplicates before the title search dedup wins.
concurrency:
  group: main-red-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    # rev3 (2026-05-12, mc#645 revert): raised 5 → 15 to absorb runner-saturation
    # latency. Original 5min cap was producing 124-style cancels under load,
    # which fed the very `[main-red]` issues this workflow files (self-poisoning).
    # 15min is still well below Gitea-default 6h job ceiling; if a real hang
    # occurs the issue-file path is still the alarm surface.
    timeout-minutes: 15
    steps:
      - name: Check out repo (script lives at .gitea/scripts/)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python (stdlib only — no PyYAML needed here)
        # The script uses stdlib urllib + json. No PyYAML required (CP's
        # drift detector needs it for AST parsing; we don't). Pin to the
        # same 3.12 hermetic interpreter CP uses so the test/runtime
        # versions stay aligned across watchdog suites.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Run main-red watchdog
        env:
          # GITEA_TOKEN reads commit status + writes issues. Falls back
          # to the auto-injected GITHUB_TOKEN if the org-level secret
          # isn't set (transitional repos), matching the same pattern
          # used by deploy-pipeline.yml + ci-required-drift.yml.
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
          GITEA_HOST: git.moleculesai.app
          REPO: ${{ github.repository }}
          # Branch under watch. `main` per directive; staging not
          # included here — staging green is a separate gate
          # (`feedback_staging_e2e_merge_gate`).
          WATCH_BRANCH: 'main'
          # Issue label applied on file/open. `ci-bp-drift` exists in the
          # molecule-core label set (verified 2026-05-11, label id 9).
          # Rationale for high: main red blocks the promotion train and
          # poisons every PR's auto-rebase base; treat as a fire even
          # if intermittent.
          RED_LABEL: 'ci-bp-drift'
        run: python3 .gitea/scripts/main-red-watchdog.py
