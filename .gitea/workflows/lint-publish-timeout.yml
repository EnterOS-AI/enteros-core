name: Lint publish-runner timeout-minutes

# Fail CI when any job running on the self-hosted `publish` runner pool
# omits `timeout-minutes`. A hung Docker build/push on the small `publish`
# pool blocks every subsequent image publish and tenant redeploy org-wide
# (issue #2913).

concurrency:
  # Auto-cancel a superseded run: a newer commit/event supersedes the old
  # one instead of leaving it queued forever (root fix for waiting-run pileup).
  # PR events group by PR number; push events group by ref.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - '.gitea/workflows/**'
      - '.gitea/scripts/lint-publish-timeout.py'
  push:
    branches: [main, staging]
    paths:
      - '.gitea/workflows/**'
      - '.gitea/scripts/lint-publish-timeout.py'

env:
  GITHUB_SERVER_URL: https://git.moleculesai.app

jobs:
  # NOT an exemption from branch protection. BP on main is
  # `status_check_contexts: ['*']` (read from the API 2026-08-11): a wildcard
  # matches every context on a commit it evaluates, so this job's
  # (pull_request) status IS merge-blocking whenever it is red. The directive
  # below is only a Tier 2g lint token recording that the context is not
  # presence-required in `.gitea/required-contexts.txt`. See
  # sweep-stale-e2e-orgs.yml for the outage this wording caused.
  # bp-exempt: informational lint; not presence-required in
  # required-contexts.txt. A red here still blocks the PR under `['*']`.
  lint:
    name: Lint publish-runner timeout-minutes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install --quiet 'PyYAML>=6.0'

      - name: Lint publish-runner timeout-minutes
        run: python3 .gitea/scripts/lint-publish-timeout.py
