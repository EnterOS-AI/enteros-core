name: staging-tenant-cd

# Gated CONTINUOUS DEPLOY of the local-docker STAGING tenant fleet.
#
# The deploy half of the tenant auto-update loop, mirroring the control-plane's
# own gated pipeline (molecule-controlplane/.gitea/workflows/
# local-cp-deploy-pipeline.yml), which likewise triggers on push to `main`. The
# operator model is TRUNK-BASED: every `main` merge is the staging candidate, so
# a push to `main` that changes the tenant image sources flows through a
# STRUCTURALLY-GATED, explicit local-Docker provider-boundary job chain:
#
#   await-image -> advance-pin -> redeploy-fleet -------------> e2e-smoke
#                              \-> runtime-image-readiness ----/     ^
#                                      ^                            HARD GATE (real staging A2A-serve e2e)
#                                      exact promoted runtime digests ready on provisioner daemon
#
# THE LOOP (build half + deploy half)
#   publish-workspace-server-image.yml  (BUILD)  — already triggers on push:[main]
#     (and legacy [staging]); on the same `main` push it builds the tenant image
#     and pushes :staging-<sha> + :staging-latest to registry.moleculesai.app via
#     the chunked pusher (:staging-<sha> is computed from the head SHA regardless
#     of branch, so THIS workflow — firing on the same `main` SHA — awaits the
#     exact per-commit artifact the build produced).
#   staging-tenant-cd.yml               (THIS)    — awaits that :staging-<sha>
#     artifact, advances the staging tenant-image DB pin through the control
#     plane, rolls the running staging tenant fleet onto it (session-preserving,
#     canary-first, /buildinfo health-gated), and gates the deployed staging
#     surface with a real staging e2e.
# The two coordinate through the immutable per-commit :staging-<sha> tag, so the
# deploy never rolls onto a half-built image and never races the build.
#
# WHY STRUCTURALLY GATED (un-bypassable)
#   e2e-smoke `needs:` BOTH redeploy-fleet and runtime-image-readiness; each
#   needs advance-pin, which needs await-image. The readiness sibling targets
#   exactly the `local-deploy` daemon selected by runner configuration and only
#   prepares its image cache from CP-owned read projections. It does NOT
#   deploy/reload the control-plane host; that provider-specific infrastructure
#   work remains outside tenant-image CI. If anything after advance-pin fails or
#   is skipped, rollback-pin restores the old pin and rerolls the staging tenant
#   fleet back to that old image. There is no continue-on-error on any gating job.
#
# SESSION PRESERVATION
#   redeploy-fleet delegates to scripts/deploy/redeploy-staging-fleet.sh, which
#   rolls ONLY the STATELESS mol-tenant-* platform containers (cp-env=staging);
#   the session-bearing mol-ws-* agent container + its mol-ws-rtstate-* volume
#   are never touched, so the concierge session survives BY CONSTRUCTION (the
#   script also asserts every rtstate volume is intact after the roll). The
#   CP-driven restart path is separately session-safe via controlplane #1118.
#
# STAGING ONLY. Production is untouched: redeploy-tenants-on-main.yml (:latest,
# PROD_AUTO_DEPLOY_DISABLED-gated) owns the prod fleet, and this pipeline never
# writes the prod pin nor the :latest tag.
#
# The image/pin/tenant-roll jobs use docker-host. Runtime readiness uses the
# dedicated local-deploy runner because that runner's mTLS Docker endpoint is
# the daemon the local-Docker workspace provisioner mutates; the script consumes
# only deployed CP HTTPS projections, never CP source. e2e-smoke runs on a Go
# runner and hits staging over HTTPS exactly like the existing
# e2e-workspace-lifecycle.yml staging job it reuses.

on:
  # TRUNK-BASED: fire on push to `main` (NOT the abandoned `staging` branch,
  # which is ~2809 commits behind main, diverged 2026-05-18, and does not even
  # contain this workflow — so a `push:[staging]` trigger could never fire). This
  # matches the control-plane deploy (local-cp-deploy-pipeline.yml, push:[main])
  # and the build half (publish-workspace-server-image.yml, push:[main,staging]),
  # so every main merge that touches the tenant runs the full staging CD.
  push:
    branches: [main]
    paths:
      - 'workspace-server/**'
      - 'canvas/**'
      - 'manifest.json'
      - '.gitea/workflows/staging-tenant-cd.yml'
      - 'scripts/deploy/redeploy-staging-fleet.sh'
      - 'scripts/deploy/advance-staging-tenant-pin.sh'
      - 'scripts/deploy/prepare-staging-runtime-images.sh'
      - 'scripts/deploy/require-local-deploy-daemon.sh'
  # Repository policy keeps dispatch flat (enforced by lint-workflow-yaml).
  # Operator overrides are read from repo/org
  # VARS instead: STAGING_TENANT_CD_IMAGE_TAG (roll to a specific tag) and
  # STAGING_TENANT_CD_FORCE_GATE_FAIL=1 (force the e2e gate RED to prove the roll
  # is blocked). Set the var, dispatch, then unset it.
  workflow_dispatch: {}

# Serialize the WHOLE pipeline GLOBALLY (one static group, NOT keyed on ref) so a
# workflow_dispatch and a main push never overlap two fleet rolls / two pin
# writes. cancel-in-progress:false — never abort an in-flight roll (each swap is
# health-gated + self-rolls-back, so a completed predecessor is always good).
concurrency:
  group: staging-tenant-cd
  cancel-in-progress: false

permissions:
  contents: read

env:
  TENANT_IMAGE: ${{ vars.MOLECULE_TENANT_IMAGE || 'registry.moleculesai.app/molecule-ai/molecule-tenant' }}

jobs:
  await-image:
    name: await-image (staging-<sha> published)
    runs-on: docker-host
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Resolve target tag
        id: resolve
        env:
          # Pre-existing shell-injection sink, fixed while hardening this file. A
          # ${{ }} expansion inside a run: body is spliced in as SHELL CODE, and these
          # jobs run on `docker-host` — privileged, with the docker socket. Passed as
          # an env VALUE and read as a shell variable instead. Pinned by
          # test_the_repo_var_is_never_interpolated_into_shell_code.
          STAGING_TENANT_CD_IMAGE_TAG: ${{ vars.STAGING_TENANT_CD_IMAGE_TAG }}
        run: |
          set -euo pipefail
          if [ -n "${STAGING_TENANT_CD_IMAGE_TAG-}" ]; then
            TAG="${STAGING_TENANT_CD_IMAGE_TAG}"
          else
            TAG="staging-${GITHUB_SHA::7}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${TENANT_IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "::notice::tenant CD target = ${TENANT_IMAGE}:${TAG}"
      - name: Wait for the published tenant image to be pullable
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
        run: |
          set -euo pipefail
          # publish-workspace-server-image.yml is building + pushing this exact
          # :staging-<sha> on the same push; poll the registry until the immutable
          # artifact the fleet will pull is present (uncapped pull through CF).
          # Dynamic wait on the real signal (the image), not a fixed sleep.
          deadline=$(( $(date +%s) + 40*60 ))
          until docker pull "$IMAGE" >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::tenant image $IMAGE never became pullable within 40m (publish build failed or slow?)"
              exit 1
            fi
            echo "  $IMAGE not yet in registry — publish still building; re-poll in 20s"
            sleep 20
          done
          docker image inspect "$IMAGE" --format 'present {{.Id}}' >/dev/null
          echo "::notice::tenant image present + pullable: $IMAGE"

  # bp-exempt: post-merge staging CD job; gated by this workflow's needs/rollback chain, not PR branch protection.
  advance-pin:
    name: advance-pin (staging tenant image DB pin)
    needs: [await-image]
    runs-on: docker-host
    timeout-minutes: 10
    outputs:
      old_image: ${{ steps.advance.outputs.old_image }}
      old_git_sha: ${{ steps.advance.outputs.old_git_sha }}
      new_image: ${{ steps.advance.outputs.new_image }}
      # THE DIGEST IS THE ONLY THING THAT MAKES THE K8S ARM ROLLABLE.
      #
      # A k8s tenant Deployment on this platform pulls from a DIFFERENT registry
      # host than the tag this lane dispatches: the workloads reference
      # registry.enteros.ai/molecule-ai/molecule-tenant@sha256:… while the lane
      # resolves registry.moleculesai.app/molecule-ai/molecule-tenant:staging-<sha>.
      # Handing the k8s roller a TAG would re-pin every workload at a host the
      # cluster is not configured to pull from.
      #
      # redeploy-tenant-fleet-k8s.sh's --digest mode exists for exactly this: it
      # re-pins each workload to <the repo it already pulls from>@<digest>, so
      # the bytes change and the registry does not. Measured 2026-08-13: both
      # hosts serve the SAME molecule-ai/molecule-tenant repository (identical
      # docker-content-digest for staging-latest), so a digest resolved against
      # one is content-addressable at the other.
      #
      # advance-pin already resolves and publishes these, so the roll inherits
      # the exact digest THIS run promoted through the CP admin API. Re-reading
      # runtime_image_pins over psql (as the production lane must, having no
      # advance-pin upstream) would add a round trip and a race with any
      # concurrent promote, for a value already in hand.
      new_digest: ${{ steps.advance.outputs.new_digest }}
      old_digest: ${{ steps.advance.outputs.old_digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Promote the staging tenant-image pin in controlplane
        id: advance
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CI_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CI_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_CI_PROJECT_ID }}
          TENANT_IMAGE_NAME: ${{ env.TENANT_IMAGE }}
        run: bash scripts/deploy/advance-staging-tenant-pin.sh --tag "${{ needs.await-image.outputs.tag }}"

  # ── WHY THIS IS ONE JOB AND NOT TWO ────────────────────────────────────────
  #
  # The production lane (redeploy-tenants-on-main.yml) splits its docker arm and
  # its k8s arm into SEPARATE jobs, and says why: "a docker arm that legitimately
  # matches zero containers cannot mask a k8s arm that failed". That split is not
  # available here, and the reason is the anti-vacuity guard rather than taste.
  #
  # Measured on the staging control plane (2026-08-12): 11 orgs, k8s=11,
  # docker=0. A docker-only job would therefore discover zero containers, have no
  # k8s arm to fall back on, and redeploy-staging-fleet.sh would — correctly —
  # refuse with "this run would roll NOTHING and still exit 0". The only two ways
  # to make such a job pass are `--allow-empty` and weakening the guard, and this
  # lane is precisely the one that reported `tenants=0 … success` for twelve
  # days. Both are disqualifying.
  #
  # So the two substrates stay in ONE process, which is what the script's own
  # substrate dispatch was built for: redeploy-staging-fleet.sh rolls the docker
  # substrate itself and dispatches the k8s substrate to
  # redeploy-tenant-fleet-k8s.sh, folding that roller's exit status in VERBATIM.
  # A docker arm matching zero containers still cannot mask a failed k8s arm —
  # the folding is what guarantees it, and it is unit-tested.
  #
  # ── AND WHY IT MOVED OFF `docker-host` ─────────────────────────────────────
  #
  # `docker-host` is the act_runner pool on robot-1/robot-2, OUTSIDE k3s. It has
  # no kubectl and no route to the cluster, so the k8s arm cannot run there at
  # all. It is also not the daemon staging tenants live on: the daemon the live
  # staging local-Docker provisioner actually mutates is the one reached from
  # `local-deploy`, which scripts/deploy/require-local-deploy-daemon.sh
  # fingerprints by asserting mTLS equality plus the presence of the staging CP
  # container on molecule-net. The docker arm is not being dropped — it is being
  # pointed at the daemon it was always supposed to enumerate, and it runs the
  # same shared swap script it always did. `local-deploy` is also where the
  # production k8s arm runs, for the same kubectl reason.
  # bp-exempt: post-merge staging CD job; gated by this workflow's needs/rollback chain, not PR branch protection.
  redeploy-fleet:
    name: redeploy-fleet (roll staging tenants, session-preserving)
    needs: [advance-pin, await-image]
    runs-on: local-deploy
    timeout-minutes: 45
    env:
      # WHERE THE STAGING CONTROL PLANE'S DATABASE ACTUALLY RUNS. Overridable as
      # repo vars so a cutover needs no code change. These are NOT the production
      # lane's values and must not be copied from it:
      #
      #   * the psql ROLE is `cps`, not `cp`. Production's CP_PROD_DB_USER
      #     default of 'cp' against this database answers "permission denied for
      #     table org_substrates" — a census that cannot read the one table it
      #     exists to read.
      #   * the namespace is controlplane-staging (the SA's RoleBindings exist in
      #     exactly controlplane-prod and controlplane-staging).
      #
      # UNVERIFIED BY THIS CHANGE: CP_STAGING_DB_POD and CP_STAGING_DB_NAME are
      # the production lane's naming applied to the staging namespace. The author
      # of this PR could not read the cluster to confirm them. They are checked
      # rather than assumed — resolve-k8s-fleet-census.sh runs the census before
      # anything trusts it and, on failure, prints all four coordinates and names
      # these repo vars as the fix. A wrong value here is a loud red, never a
      # quiet empty fleet.
      CP_STAGING_NAMESPACE: ${{ vars.CP_STAGING_NAMESPACE || 'controlplane-staging' }}
      CP_STAGING_DB_POD: ${{ vars.CP_STAGING_DB_POD || 'controlplane-db-postgres-0' }}
      CP_STAGING_DB_USER: ${{ vars.CP_STAGING_DB_USER || 'cps' }}
      CP_STAGING_DB_NAME: ${{ vars.CP_STAGING_DB_NAME || 'cp_staging' }}
      # Orgs the control plane places on the k8s substrate that the cluster
      # cannot resolve to a rollable workload. EMPTY BY DEFAULT, deliberately: an
      # exclusion list checked into a workflow is a permanent, invisible hole in
      # the deploy, and the four drifted orgs measured on 2026-08-12 are
      # test debris that should be deprovisioned rather than memorialised in CI.
      # Whatever is set here is not taken on trust — fleet-drift-audit.sh refuses
      # any entry that is not measurably drifted at that moment.
      STAGING_FLEET_EXCLUDE_SLUGS: ${{ vars.STAGING_FLEET_EXCLUDE_SLUGS }}
    # RAN-SENTINEL. This job's `result` is read as a verdict by rollback-pin, so
    # it must also publish evidence that its body actually EXECUTED. See
    # scripts/deploy/ran-sentinel.sh for the full rationale (Gitea PickTask
    # commits the claim before delivering the payload; an undelivered task is
    # reaped as `failure` with an empty log, indistinguishable from a real one).
    outputs:
      ran_begin: ${{ steps.ran_begin.outputs.token }}
      ran_end: ${{ steps.ran_end.outputs.token }}
    steps:
      # FIRST step, before checkout and with no `if:` — the only way to emit it
      # is for the job body to have been dispatched and started.
      - name: ran-sentinel BEGIN (proves this job's body actually started)
        id: ran_begin
        env:
          RAN_SENTINEL_JOB: redeploy-fleet
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_RUN_ID-}" ]; then
            echo "::error::ran-sentinel: GITHUB_RUN_ID is empty or unset — refusing to emit a token that is not bound to this run, because an unbound token makes every downstream comparison unfalsifiable."
            exit 1
          fi
          printf 'token=ran-sentinel/v1 %s begin run=%s\n' "$RAN_SENTINEL_JOB" "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "ran-sentinel BEGIN emitted for $RAN_SENTINEL_JOB (run $GITHUB_RUN_ID)"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Same daemon fingerprint runtime-image-readiness runs, for the same
      # reason: this job now MUTATES containers on the local-deploy endpoint, and
      # the docker arm's target set is whatever that daemon reports. Proving the
      # endpoint identity before the first mutation is what makes "0 docker
      # tenants" a fact about staging rather than a fact about which daemon
      # answered.
      - name: Verify the exact local-deploy Docker daemon
        run: bash scripts/deploy/require-local-deploy-daemon.sh

      # The roller and the auditor must EXIST before anything claims to have run
      # them. Checked explicitly rather than left to `bash <missing>`, and
      # deliberately never softened into "skip if absent": a step that quietly
      # does nothing when its own tool is missing is the vacuous pass this whole
      # job exists to remove, reintroduced one level up.
      - name: Preflight — the k8s roller and the drift auditor must exist
        run: |
          set -euo pipefail
          missing=""
          for f in scripts/deploy/redeploy-tenant-fleet-k8s.sh \
                   scripts/deploy/resolve-k8s-fleet-census.sh \
                   scripts/deploy/fleet-drift-audit.sh; do
            [ -f "$f" ] || missing="${missing} ${f}"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing:${missing} — refusing to report a fleet roll this job cannot perform."
            exit 1
          fi
          echo "roller + census resolver + drift auditor present"

      # THE TOOLCHAIN IS A DEPENDENCY, SO IT GETS A PREFLIGHT LIKE ONE.
      # `local-deploy` is an Alpine/musl host-executor pod; python3 and kubectl
      # were never declared anywhere and the production k8s arm died with
      # `python3: command not found` (exit 127) on its first real run because of
      # it. Resolve them by name, up front, into absolute paths, and say WHICH
      # one is missing when one is.
      - name: Preflight — resolve the toolchain, or NAME the tool that is missing
        run: |
          set -euo pipefail
          # NOT `... >> "$GITHUB_ENV"`. A capture redirected straight into its
          # destination is written before anything has judged it; validate first,
          # then write.
          rc=0
          resolved="$(bash scripts/deploy/require-deploy-toolchain.sh \
            'DEPLOY_PYTHON3:python3:python3:--version' \
            'KUBECTL:kubectl:kubectl:version --client')" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::the deploy toolchain preflight FAILED (exit ${rc}) on runner '${RUNNER_NAME:-<unknown>}'. The ::error:: above names the tool."
            exit 1
          fi
          if [ -z "$resolved" ]; then
            echo "::error::the toolchain preflight exited 0 and resolved NOTHING. An empty result would leave every later step back on ambient PATH lookup while this step reported success."
            exit 1
          fi
          printf '%s\n' "$resolved" >> "$GITHUB_ENV"
          printf 'toolchain resolved:\n%s\n' "$resolved"

      # ONE CREDENTIAL, NOT TWO. The k8s arm needs a substrate census and a
      # cluster it can patch. The obvious wiring for the census is a CP database
      # DSN — a second credential, with a second lifecycle, naming a host that
      # has to stay correct. It did not stay correct: the k3s cutover left
      # same-named, stopped-but-reachable docker databases behind, so a DSN-wired
      # census can read a control plane the live CP no longer writes to and be
      # confidently wrong. Both the census and the roll therefore go through the
      # SAME kubectl, so the census cannot silently address a different control
      # plane than the roll.
      - name: Resolve the cluster credential and PROVE the census returns rows
        env:
          INFISICAL_CI_CLIENT_ID: ${{ secrets.INFISICAL_CI_CLIENT_ID }}
          INFISICAL_CI_CLIENT_SECRET: ${{ secrets.INFISICAL_CI_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_CI_PROJECT_ID }}
          INFISICAL_SECRET_ENV: staging
          CP_CENSUS_NAMESPACE: ${{ env.CP_STAGING_NAMESPACE }}
          CP_CENSUS_DB_POD: ${{ env.CP_STAGING_DB_POD }}
          CP_CENSUS_DB_USER: ${{ env.CP_STAGING_DB_USER }}
          CP_CENSUS_DB_NAME: ${{ env.CP_STAGING_DB_NAME }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/fleet-census.env"
          # Judge, then write. The resolver prints nothing to stdout and fails
          # closed with a named diagnostic; a bare `>> "$GITHUB_ENV"` here would
          # publish a half-written env from a failed resolve.
          rc=0
          bash scripts/deploy/resolve-k8s-fleet-census.sh --env-out "$out" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::could not resolve a cluster credential + substrate census (exit ${rc}); the ::error:: above says which of credential, connectivity or census coordinates failed. Refusing to roll a fleet this job cannot enumerate."
            exit "$rc"
          fi
          if [ ! -s "$out" ]; then
            echo "::error::the census resolver exited 0 and wrote NOTHING. An empty result would leave the roller with no census source, which its own guard would report as 'the fleet is empty' — a fact about this wiring dressed up as a fact about staging."
            exit 1
          fi
          cat "$out" >> "$GITHUB_ENV"
          printf 'census wiring published:\n%s\n' "$(cut -d= -f1 "$out")"

      # DRIFT IS REPORTED BEFORE IT IS EXCLUDED, AND AN EXCLUSION MUST BE EARNED.
      # This runs the shipped roller in --dry-run with NO exclusions, so the
      # classification comes from the roller itself, names every drifted org as a
      # ::warning:: and in the job summary, and then REFUSES any excluded slug
      # that is not measurably drifted right now. That is what keeps
      # STAGING_FLEET_EXCLUDE_SLUGS from degrading into `--allow-empty` spelled
      # differently: it can only ever wave past a tenant the cluster genuinely
      # cannot roll, never a live one.
      - name: Fleet drift audit (report drift; refuse an unearned exclusion)
        env:
          K8S_TENANT_DIGEST: ${{ needs.advance-pin.outputs.new_digest }}
          EXCLUDE_SLUGS: ${{ env.STAGING_FLEET_EXCLUDE_SLUGS }}
        run: |
          set -euo pipefail
          if [ -z "${K8S_TENANT_DIGEST-}" ]; then
            echo "::error::advance-pin published no new_digest, so there is no digest to plan the k8s roll against. Refusing to fall back to a moving tag — the tenant workloads pull from a different registry host than this lane's tag names, and a tag re-pin would point them at a registry the cluster cannot pull from."
            exit 1
          fi
          bash scripts/deploy/fleet-drift-audit.sh \
            --digest "$K8S_TENANT_DIGEST" \
            --exclude "${EXCLUDE_SLUGS-}"

      - name: Roll the staging tenant fleet onto the gate-proven image
        env:
          TENANT_IMAGE: ${{ env.TENANT_IMAGE }}
          # The k8s arm's target. See advance-pin's `new_digest` output for why a
          # digest and not the tag: the workloads pull from a different registry
          # host, and --digest re-pins each to <its own repo>@<digest>.
          K8S_TENANT_DIGEST: ${{ needs.advance-pin.outputs.new_digest }}
          # Read by redeploy-staging-fleet.sh as EXCLUDE, and passed through to
          # the k8s roller. Every entry was proven drifted by the audit step
          # above, which fails the job otherwise.
          EXCLUDE_SLUGS: ${{ env.STAGING_FLEET_EXCLUDE_SLUGS }}
          # STAGING_TENANT_FLAGS is the SSOT for the managed rollout flags (see
          # MANAGED_FLAG_KEYS in redeploy-staging-fleet.sh). The script strips every
          # managed key from the inherited tenant env and re-applies only what
          # TENANT_FLAGS names, so a call site that omits it silently turns those
          # flags OFF across the fleet. Empty is the correct default (flags dark);
          # an operator turns a flag on by setting this repo var, NOT by hand-setting
          # env on a container — that would be sticky forever, which is the drift
          # this whole mechanism replaces.
          #
          # Interpolated into `env:` (a VALUE), never into the `run:` body: a
          # ${{ }} expansion inside run: is spliced in as SHELL CODE, so a var value
          # of `x"; touch /tmp/PWNED; echo "` would execute on this runner — and this
          # job holds a live mTLS endpoint to the staging tenant daemon and a
          # cluster credential.
          STAGING_TENANT_FLAGS: ${{ vars.STAGING_TENANT_FLAGS }}
        # `${STAGING_TENANT_FLAGS-}` — the shell, not the templater, supplies the
        # default. An undefined repo var may arrive as an OMITTED env entry rather
        # than an empty one, and the script now FAILS CLOSED on an unset
        # TENANT_FLAGS; without this `-` default, a repo that has never created the
        # var would have every staging CD roll hard-abort. The call site declares
        # its flag state explicitly, which is exactly what the fail-closed check asks
        # for.
        run: |
          set -euo pipefail
          # SUBSTRATE_CENSUS_CMD reaches here through $GITHUB_ENV. Asserted
          # explicitly because its ABSENCE is the whole defect this PR fixes: the
          # script's own refusal then reads "0 staging tenant containers found …
          # and no k8s arm was dispatched", which is true but points at the fleet
          # rather than at the wiring that failed to arm it.
          if [ -z "${SUBSTRATE_CENSUS_CMD-}" ]; then
            echo "::error::SUBSTRATE_CENSUS_CMD is unset at the roll step, so redeploy-staging-fleet.sh would run its DOCKER arm only — and on a control plane whose tenants are all on k8s that is a roll of nothing. The census resolution step above must have been removed, reordered, or failed to publish."
            exit 1
          fi
          # --allow-empty is deliberately NOT passed, here or anywhere in this
          # lane. An empty fleet is only ever acceptable as an explicit operator
          # assertion, and the census resolver has already proven this one is not
          # empty.
          TENANT_FLAGS="${STAGING_TENANT_FLAGS-}" \
            bash scripts/deploy/redeploy-staging-fleet.sh --tag "${{ needs.await-image.outputs.tag }}"
      # LAST step, under `if: always()`. `always()` is REQUIRED, not incidental:
      # a job that ran and genuinely FAILED must still emit END, or its own
      # failure would look like a phantom and suppress the rollback it is owed.
      # Its absence therefore means only one thing — the job was killed part-way
      # through and never reached its final step.
      - name: ran-sentinel END (proves this job's body ran to completion)
        id: ran_end
        if: always()
        env:
          RAN_SENTINEL_JOB: redeploy-fleet
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_RUN_ID-}" ]; then
            echo "::error::ran-sentinel: GITHUB_RUN_ID is empty or unset — refusing to emit a token that is not bound to this run, because an unbound token makes every downstream comparison unfalsifiable."
            exit 1
          fi
          printf 'token=ran-sentinel/v1 %s end run=%s\n' "$RAN_SENTINEL_JOB" "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "ran-sentinel END emitted for $RAN_SENTINEL_JOB (run $GITHUB_RUN_ID)"

  # bp-exempt: post-merge staging CD hard gate; enforced by e2e needs + rollback, not PR branch protection.
  runtime-image-readiness:
    name: runtime-image-readiness (exact promoted digests on provisioner daemon)
    needs: [advance-pin]
    # This is the runner whose operator-configured mTLS endpoint reaches the
    # daemon used by the staging local-Docker provisioner. The checked-in guard
    # proves endpoint equality + mTLS + the staging CP's molecule-net
    # attachment before any pull.
    runs-on: local-deploy
    timeout-minutes: 30
    # RAN-SENTINEL — see redeploy-fleet above and scripts/deploy/ran-sentinel.sh.
    outputs:
      ran_begin: ${{ steps.ran_begin.outputs.token }}
      ran_end: ${{ steps.ran_end.outputs.token }}
    steps:
      - name: ran-sentinel BEGIN (proves this job's body actually started)
        id: ran_begin
        env:
          RAN_SENTINEL_JOB: runtime-image-readiness
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_RUN_ID-}" ]; then
            echo "::error::ran-sentinel: GITHUB_RUN_ID is empty or unset — refusing to emit a token that is not bound to this run, because an unbound token makes every downstream comparison unfalsifiable."
            exit 1
          fi
          printf 'token=ran-sentinel/v1 %s begin run=%s\n' "$RAN_SENTINEL_JOB" "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "ran-sentinel BEGIN emitted for $RAN_SENTINEL_JOB (run $GITHUB_RUN_ID)"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify the exact local-deploy Docker daemon
        run: bash scripts/deploy/require-local-deploy-daemon.sh
      - name: Pre-pull and RepoDigest-verify every promoted pinnable runtime
        env:
          CP_BASE_URL: https://staging-api.moleculesai.app
          INFISICAL_BASE: https://key.moleculesai.app
          INFISICAL_ENV: staging
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CI_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CI_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_CI_PROJECT_ID }}
        run: bash scripts/deploy/prepare-staging-runtime-images.sh
      - name: ran-sentinel END (proves this job's body ran to completion)
        id: ran_end
        if: always()
        env:
          RAN_SENTINEL_JOB: runtime-image-readiness
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_RUN_ID-}" ]; then
            echo "::error::ran-sentinel: GITHUB_RUN_ID is empty or unset — refusing to emit a token that is not bound to this run, because an unbound token makes every downstream comparison unfalsifiable."
            exit 1
          fi
          printf 'token=ran-sentinel/v1 %s end run=%s\n' "$RAN_SENTINEL_JOB" "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "ran-sentinel END emitted for $RAN_SENTINEL_JOB (run $GITHUB_RUN_ID)"

  e2e-smoke:
    name: e2e-smoke (staging real provision + A2A HARD GATE)
    needs: [redeploy-fleet, runtime-image-readiness]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # RAN-SENTINEL. THE case this mechanism was built for: two staging pin
    # rollbacks were triggered solely by this job's phantom red
    # (`redeploy=success readiness=success e2e=failure`), CP audit 40708 landing
    # 23 seconds after the reaper stamped task 989633 failed.
    outputs:
      ran_begin: ${{ steps.ran_begin.outputs.token }}
      ran_end: ${{ steps.ran_end.outputs.token }}
    env:
      CP_BASE_URL: https://staging-api.moleculesai.app
      E2E_PROVIDER: molecules-server
      STAGING_E2E: '1'
      # Consumed only by the `if: always()` teardown safety net below (the purge
      # helper tests/e2e/lib/cp_purge_receipt.sh origin/backend guards). The Go
      # test itself reads E2E_PROVIDER, not this.
      E2E_INFRA_BACKEND: local-docker
      GATE_FORCE_FAIL: ${{ vars.STAGING_TENANT_CD_FORCE_GATE_FAIL }}
      # E2E_DEFAULT_RUNTIME is exported by the Infisical step below from the same
      # optional /shared/controlplane selector the deployed CP consumes. When the
      # selector is absent, both CP and this gate use the Hermes product fallback.
      # Require the REAL A2A tool-use turn (drive the concierge to actually RUN
      # provision_workspace and assert the created workspace appears) — not
      # presence-only. This is the deep "callable" proof that catches a
      # present-but-not-runnable verb (the flaw that let regressions reach prod).
      E2E_ASSERT_MGMT_MCP_CALLABLE: '1'
      # REQUIRE-LIVE posture (mirrors CP serving-e2e SERVING_E2E_REQUIRE_LIVE).
      # requireStagingEnv SKIPs when STAGING_E2E/CP_BASE_URL/CP_ADMIN_API_TOKEN
      # are absent, and `go test` reports a skipped-only package as `ok` — so a
      # credential that silently stopped resolving would turn this HARD GATE into
      # a green that asserted nothing, and under the `["*"]` branch-protection
      # wildcard that green is indistinguishable from a real one. Under this flag
      # a missing precondition is a LOUD FAILURE: a skip is a misconfiguration of
      # CI, not an optional arm. It also makes the callable turn non-optional, so
      # the gate can never silently degrade to presence-only.
      GUARD_B_REQUIRE_CALLABLE: '1'
    steps:
      - name: ran-sentinel BEGIN (proves this job's body actually started)
        id: ran_begin
        env:
          RAN_SENTINEL_JOB: e2e-smoke
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_RUN_ID-}" ]; then
            echo "::error::ran-sentinel: GITHUB_RUN_ID is empty or unset — refusing to emit a token that is not bound to this run, because an unbound token makes every downstream comparison unfalsifiable."
            exit 1
          fi
          printf 'token=ran-sentinel/v1 %s begin run=%s\n' "$RAN_SENTINEL_JOB" "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "ran-sentinel BEGIN emitted for $RAN_SENTINEL_JOB (run $GITHUB_RUN_ID)"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Force-fail hook (prove a red gate rolls back the fleet)
        run: |
          set -euo pipefail
          if [ "${GATE_FORCE_FAIL:-0}" = "1" ]; then
            echo "::error::GATE_FORCE_FAIL=1 — gate forced RED; this MUST roll back the staging pin and tenant fleet."
            exit 1
          fi
          echo "gate not forced — running the real e2e"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 'stable'
          cache: false
          cache-dependency-path: workspace-server/go.sum
      # Reuse the SSOT staging e2e (workspace-server/internal/staginge2e): it
      # provisions a REAL throwaway molecules-server tenant, creates a workspace,
      # and asserts it SERVES A2A across restart/pause/hibernate — i.e. the tenant
      # runtime works on staging. Same recipe as e2e-workspace-lifecycle.yml's
      # staging job; no CP source dependency (HTTPS client of the deployed CP).
      - name: Fetch staging CP admin token from Infisical KMS
        env:
          INFISICAL_CI_CLIENT_ID: ${{ secrets.INFISICAL_CI_CLIENT_ID }}
          INFISICAL_CI_CLIENT_SECRET: ${{ secrets.INFISICAL_CI_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_CI_PROJECT_ID }}
        run: |
          set -uo pipefail
          BASE="https://key.moleculesai.app"
          # Cloudflare rejects some default client signatures; use the platform's
          # canonical accepted User-Agent on every Infisical request.
          TOK=$(curl -fsS -A curl/8.4.0 -X POST "$BASE/api/v1/auth/universal-auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$INFISICAL_CI_CLIENT_ID\",\"clientSecret\":\"$INFISICAL_CI_CLIENT_SECRET\"}" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); v=d.get("accessToken"); sys.stdout.write(v if isinstance(v,str) and v else "")')
          if [ -z "$TOK" ]; then echo "::error::Infisical accessToken empty - failing closed"; exit 1; fi
          echo "::add-mask::$TOK"
          CP_ADMIN_API_TOKEN=$(curl -fsS -A curl/8.4.0 "$BASE/api/v3/secrets/raw/CP_ADMIN_API_TOKEN?workspaceId=$INFISICAL_PROJECT_ID&environment=staging&secretPath=%2Fshared%2Fcontrolplane-admin" \
            -H "Authorization: Bearer $TOK" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); v=(d.get("secret") or {}).get("secretValue"); sys.stdout.write(v if isinstance(v,str) and v else "")')
          echo "::add-mask::$CP_ADMIN_API_TOKEN"
          if [ -z "$CP_ADMIN_API_TOKEN" ]; then
            echo "::error::Infisical returned empty CP_ADMIN_API_TOKEN at staging /shared/controlplane-admin — failing closed."
            exit 1
          fi

          # Resolve the expected concierge runtime from the same optional KMS
          # selector the control plane consumes. A missing secret means the
          # compiled Hermes product fallback; transport/auth/server failures are
          # not equivalent to "unset" and fail the deploy gate closed.
          runtime_body=$(mktemp)
          trap 'rm -f "$runtime_body"' EXIT
          runtime_status=$(curl -sS -A curl/8.4.0 -o "$runtime_body" -w "%{http_code}" \
            "$BASE/api/v3/secrets/raw/MOLECULE_DEFAULT_RUNTIME?workspaceId=$INFISICAL_PROJECT_ID&environment=staging&secretPath=%2Fshared%2Fcontrolplane" \
            -H "Authorization: Bearer $TOK")
          case "$runtime_status" in
            200)
              MOLECULE_DEFAULT_RUNTIME=$(python3 -c 'import sys,json; d=json.load(sys.stdin); v=(d.get("secret") or {}).get("secretValue"); sys.stdout.write(v.strip() if isinstance(v,str) else "")' < "$runtime_body")
              if [ -z "$MOLECULE_DEFAULT_RUNTIME" ]; then
                echo "::error::Infisical returned an empty MOLECULE_DEFAULT_RUNTIME value at staging /shared/controlplane — failing closed."
                exit 1
              fi
              ;;
            404)
              MOLECULE_DEFAULT_RUNTIME=""
              ;;
            *)
              echo "::error::Infisical MOLECULE_DEFAULT_RUNTIME lookup returned HTTP $runtime_status — failing closed."
              exit 1
              ;;
          esac

          E2E_DEFAULT_RUNTIME="${MOLECULE_DEFAULT_RUNTIME:-hermes}"
          echo "CP_ADMIN_API_TOKEN=$CP_ADMIN_API_TOKEN" >> "$GITHUB_ENV"
          echo "E2E_DEFAULT_RUNTIME=$E2E_DEFAULT_RUNTIME" >> "$GITHUB_ENV"
          echo "CP_ADMIN_API_TOKEN loaded from Infisical staging SSOT (len=${#CP_ADMIN_API_TOKEN})"
          echo "Expected concierge runtime resolved from Infisical staging SSOT: $E2E_DEFAULT_RUNTIME"
          rm -f "$runtime_body"
          trap - EXIT
      - name: CP staging health preflight
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "$CP_BASE_URL/health")
          if [ "$code" != "200" ]; then
            echo "::error::Staging CP unhealthy (HTTP $code) — infra, not a lifecycle bug. Failing loud."
            exit 1
          fi
          echo "Staging CP healthy"
      - name: Bind candidate build SHA for tenant /buildinfo guard
        env:
          # See "Resolve target tag" above — env: value, not run:-body interpolation.
          STAGING_TENANT_CD_IMAGE_TAG: ${{ vars.STAGING_TENANT_CD_IMAGE_TAG }}
        run: |
          set -euo pipefail
          if [ -n "${STAGING_TENANT_CD_IMAGE_TAG-}" ]; then
            echo "::notice::STAGING_TENANT_CD_IMAGE_TAG override set; skipping strict candidate SHA bind because the override may not be this workflow SHA."
            exit 0
          fi
          echo "E2E_EXPECT_TENANT_BUILD_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "::notice::candidate-build guard expects tenant /buildinfo git_sha=$GITHUB_SHA"
      - name: Run workspace-lifecycle + fresh-org platform-agent mgmt-MCP staginge2e (HARD GATE)
        working-directory: workspace-server
        # TestWorkspaceLifecycle_Staging: a workspace serves A2A across restart/pause/hibernate.
        # TestPlatformAgentMgmtMCP_Staging (Guard B): a FRESH org's platform agent reaches online on
        #   the EXPECTED default runtime (E2E_DEFAULT_RUNTIME) WITH its management MCP
        #   present AND — because E2E_ASSERT_MGMT_MCP_CALLABLE=1 — a REAL A2A tool-use turn drives it
        #   to actually RUN provision_workspace and a genuine kind='workspace' row appears (genuinely
        #   CALLABLE, not presence-only). The lifecycle test only exercises a PLAIN workspace (no
        #   declared plugins), so it cannot see a fresh Hermes concierge whose mgmt-MCP plugin never
        #   installed — the operator "test14" failure (a presign:// declared source the deployed
        #   runtime could not resolve). This makes the deploy gate go RED on that failure. BOTH must
        #   pass after the fleet roll (needs-gated, un-bypassable).
        run: go test -tags staging_e2e ./internal/staginge2e/ -run 'TestWorkspaceLifecycle_Staging|TestPlatformAgentMgmtMCP_Staging' -count=1 -v -timeout 50m
      # Belt-and-braces teardown: the Go test installs a t.Cleanup admin-DELETE
      # of its own tenant, but Go SKIPS t.Cleanup when `go test -timeout` fires
      # or the runner is SIGKILLed — so a timed-out/cancelled Go test leaks its
      # org. This net purges any CP admin org whose slug carries THIS run's
      # GITHUB_RUN_ID for the exact tag(s) this job creates (e2eSlug formats
      # slugs as e2e-<tag>-<run_id>-<uniq>), via the SAME identity-bound purge
      # helper the shell jobs use (cp_purge_receipt.sh) — no new auth path.
      # Idempotent with t.Cleanup; a fast no-op on the happy path.
      - name: Teardown safety net (runs on timeout/cancel/failure)
        # push/dispatch-only workflow; the PR guard is a uniform no-op here.
        if: always() && github.event_name != 'pull_request'
        env:
          # Sourced from Infisical (staging /shared/controlplane-admin) via the
          # "Fetch staging CP admin token from Infisical KMS" step above.
          ADMIN_TOKEN: ${{ env.CP_ADMIN_API_TOKEN }}
          # BOTH tags THIS job's -run creates: TestWorkspaceLifecycle_Staging →
          # e2eSlug("life") AND TestPlatformAgentMgmtMCP_Staging → e2eSlug("mcp").
          # Scopes the run-id sweep to only this job's orgs so a parallel sibling
          # job's in-flight org is never purged.
          TEARDOWN_TAGS: "life mcp"
        run: bash tests/e2e/lib/go_e2e_run_teardown.sh
      - name: ran-sentinel END (proves this job's body ran to completion)
        id: ran_end
        if: always()
        env:
          RAN_SENTINEL_JOB: e2e-smoke
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_RUN_ID-}" ]; then
            echo "::error::ran-sentinel: GITHUB_RUN_ID is empty or unset — refusing to emit a token that is not bound to this run, because an unbound token makes every downstream comparison unfalsifiable."
            exit 1
          fi
          printf 'token=ran-sentinel/v1 %s end run=%s\n' "$RAN_SENTINEL_JOB" "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "ran-sentinel END emitted for $RAN_SENTINEL_JOB (run $GITHUB_RUN_ID)"

  rollback-pin:
    name: rollback-pin (revert pin if the fleet roll failed)
    needs: [advance-pin, redeploy-fleet, runtime-image-readiness, e2e-smoke]
    # ALWAYS-RUN + explicit in-job branch (main-status coherence). Because this
    # workflow advances the pin before the fleet roll, any failure/skipped path
    # after advance-pin must restore the old pin and reroll staging tenants back
    # onto it. Green fleet roll + e2e is the only no-op path.
    if: always()
    # Follows redeploy-fleet onto `local-deploy`, and for the same two reasons: a
    # revert that cannot reach the staging tenant daemon rolls no docker tenant,
    # and a revert with no kubectl rolls no k8s tenant. A rollback that can only
    # undo the PIN and not the FLEET leaves the running tenants on the failed
    # candidate while the control plane says otherwise — the exact split-brain
    # this job exists to close.
    runs-on: local-deploy
    timeout-minutes: 30
    env:
      # Same coordinates as redeploy-fleet; see that job for why they are not the
      # production lane's values and which two are unverified.
      CP_STAGING_NAMESPACE: ${{ vars.CP_STAGING_NAMESPACE || 'controlplane-staging' }}
      CP_STAGING_DB_POD: ${{ vars.CP_STAGING_DB_POD || 'controlplane-db-postgres-0' }}
      CP_STAGING_DB_USER: ${{ vars.CP_STAGING_DB_USER || 'cps' }}
      CP_STAGING_DB_NAME: ${{ vars.CP_STAGING_DB_NAME || 'cp_staging' }}
      STAGING_FLEET_EXCLUDE_SLUGS: ${{ vars.STAGING_FLEET_EXCLUDE_SLUGS }}
    # RAN-SENTINEL. rollback-pin is EQUALLY exposed: task 885373 was itself a
    # phantom, so a genuinely-failed candidate stayed pinned because its
    # rollback was never delivered. Nothing downstream `needs:` this job, so the
    # terminal `rollback-audit` job below consumes these outputs.
    outputs:
      ran_begin: ${{ steps.ran_begin.outputs.token }}
      ran_end: ${{ steps.ran_end.outputs.token }}
    steps:
      - name: ran-sentinel BEGIN (proves this job's body actually started)
        id: ran_begin
        env:
          RAN_SENTINEL_JOB: rollback-pin
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_RUN_ID-}" ]; then
            echo "::error::ran-sentinel: GITHUB_RUN_ID is empty or unset — refusing to emit a token that is not bound to this run, because an unbound token makes every downstream comparison unfalsifiable."
            exit 1
          fi
          printf 'token=ran-sentinel/v1 %s begin run=%s\n' "$RAN_SENTINEL_JOB" "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "ran-sentinel BEGIN emitted for $RAN_SENTINEL_JOB (run $GITHUB_RUN_ID)"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Revert the staging pin and fleet on failed candidate path
        env:
          ADVANCE_RESULT: ${{ needs.advance-pin.result }}
          REDEPLOY_RESULT: ${{ needs.redeploy-fleet.result }}
          READINESS_RESULT: ${{ needs.runtime-image-readiness.result }}
          E2E_RESULT: ${{ needs.e2e-smoke.result }}
          # RAN-SENTINEL evidence for each result read above. A result whose
          # sentinel is absent is NOT a verdict — the job never executed.
          REDEPLOY_BEGIN: ${{ needs.redeploy-fleet.outputs.ran_begin }}
          REDEPLOY_END: ${{ needs.redeploy-fleet.outputs.ran_end }}
          READINESS_BEGIN: ${{ needs.runtime-image-readiness.outputs.ran_begin }}
          READINESS_END: ${{ needs.runtime-image-readiness.outputs.ran_end }}
          E2E_BEGIN: ${{ needs.e2e-smoke.outputs.ran_begin }}
          E2E_END: ${{ needs.e2e-smoke.outputs.ran_end }}
          OLD_IMAGE: ${{ needs.advance-pin.outputs.old_image }}
          OLD_GIT_SHA: ${{ needs.advance-pin.outputs.old_git_sha }}
          OLD_DIGEST: ${{ needs.advance-pin.outputs.old_digest }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CI_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CI_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_CI_PROJECT_ID }}
          # The Infisical SSOT READER reads a different identity triple than
          # advance-staging-tenant-pin.sh does (INFISICAL_CI_CLIENT_ID vs
          # INFISICAL_CLIENT_ID). Both are wired: this step calls both tools, and
          # a missing pair would surface as "Infisical CI identity environment is
          # incomplete" from inside the census resolver — after the pin was
          # already reverted, which is the wrong place to discover it.
          INFISICAL_CI_CLIENT_ID: ${{ secrets.INFISICAL_CI_CLIENT_ID }}
          INFISICAL_CI_CLIENT_SECRET: ${{ secrets.INFISICAL_CI_CLIENT_SECRET }}
          INFISICAL_SECRET_ENV: staging
          CP_CENSUS_NAMESPACE: ${{ env.CP_STAGING_NAMESPACE }}
          CP_CENSUS_DB_POD: ${{ env.CP_STAGING_DB_POD }}
          CP_CENSUS_DB_USER: ${{ env.CP_STAGING_DB_USER }}
          CP_CENSUS_DB_NAME: ${{ env.CP_STAGING_DB_NAME }}
          STAGING_FLEET_EXCLUDE_SLUGS: ${{ env.STAGING_FLEET_EXCLUDE_SLUGS }}
          TENANT_IMAGE: ${{ env.TENANT_IMAGE }}
          TENANT_IMAGE_NAME: ${{ env.TENANT_IMAGE }}
          # Roll BACK with the same declared flag state we roll FORWARD with, or a
          # failed candidate would ALSO (invisibly) end an in-flight burn-in.
          # In `env:`, not `export ... ${{ }}` in the body — see the roll step above.
          STAGING_TENANT_FLAGS: ${{ vars.STAGING_TENANT_FLAGS }}
        run: |
          set -euo pipefail
          . scripts/deploy/ran-sentinel.sh
          # Defined for BOTH redeploy invocations below. The shell supplies the
          # default so an undefined repo var can never hard-abort the rollback —
          # the one path you least want to fail is the one that undoes a bad deploy.
          TENANT_FLAGS="${STAGING_TENANT_FLAGS-}"
          export TENANT_FLAGS
          if [ -z "${ADVANCE_RESULT-}" ]; then
            echo "::error::advance-pin result is empty — refusing to decide anything about the staging pin from a missing input."
            exit 1
          fi
          if [ "$ADVANCE_RESULT" != "success" ]; then
            echo "::notice::pin never advanced (advance-pin=$ADVANCE_RESULT) — nothing to revert."
            exit 0
          fi

          # RAN-SENTINEL GATE. Classify every job whose `result` is about to be
          # read, using the evidence that it actually executed. This runs BEFORE
          # the green early-exit on purpose: a `success` that never reached its
          # own last step must be surfaced, not silently accepted.
          RAN_SENTINEL_REPORT="$(mktemp)"
          export RAN_SENTINEL_REPORT
          DECISION="$(ran_sentinel_decide \
            redeploy-fleet          "${REDEPLOY_RESULT-}"  "${REDEPLOY_BEGIN-}"  "${REDEPLOY_END-}" \
            runtime-image-readiness "${READINESS_RESULT-}" "${READINESS_BEGIN-}" "${READINESS_END-}" \
            e2e-smoke               "${E2E_RESULT-}"       "${E2E_BEGIN-}"       "${E2E_END-}")"
          echo "ran-sentinel verdicts (decision=$DECISION):"
          cat "$RAN_SENTINEL_REPORT"
          rm -f "$RAN_SENTINEL_REPORT"

          case "$DECISION" in
            INFRA_FAULT)
              # A job whose result we were about to act on never executed. Gitea
              # PickTask commits the claim before delivering the payload; an
              # undelivered task is reaped as `failure` with an EMPTY log
              # 10-15 minutes later. Rolling the fleet on that is acting on a
              # verdict nobody produced. Fail loud; touch nothing.
              echo "::error::ran-sentinel MISSING on a job whose result feeds this decision — that job never executed, so its result is not a verdict. REFUSING to roll the staging fleet. Note the staging pin IS advanced and the fleet may be unrolled: this needs an operator, not a rerun."
              exit 1
              ;;
            NO_ROLLBACK)
              echo "::notice::candidate fleet roll + runtime readiness + e2e green, each with a complete ran-sentinel — no rollback needed."
              exit 0
              ;;
            ROLLBACK) ;;
            *)
              echo "::error::unrecognised ran-sentinel decision '$DECISION' — failing closed without touching the staging fleet."
              exit 1
              ;;
          esac

          if [ -z "$OLD_IMAGE" ]; then
            echo "::warning::advance-pin succeeded but exposed no old_image — cannot auto-revert; operator attention needed."
            exit 0
          fi
          echo "::warning::candidate path failed after pin advance (redeploy=$REDEPLOY_RESULT readiness=$READINESS_RESULT e2e=$E2E_RESULT), each verdict backed by a ran-sentinel — reverting staging pin and fleet to $OLD_IMAGE"

          # THE PIN GOES BACK FIRST, AND UNCONDITIONALLY.
          #
          # Everything below this line needs a cluster credential the operator
          # may not have seeded yet. If credential resolution were a preceding
          # job STEP, an absent secret would fail this job BEFORE the pin was
          # restored, leaving staging pinned to a candidate that had already
          # failed — strictly worse than the state this job exists to repair. So
          # the pin revert happens here, and the fleet re-roll is wired
          # afterwards.
          if [ -n "$OLD_GIT_SHA" ]; then
            bash scripts/deploy/advance-staging-tenant-pin.sh --image "$OLD_IMAGE" --git-sha "$OLD_GIT_SHA"
          else
            bash scripts/deploy/advance-staging-tenant-pin.sh --image "$OLD_IMAGE"
          fi

          # ── The k8s arm of the REVERT ─────────────────────────────────────
          # Same daemon fingerprint and same census wiring as the forward roll,
          # resolved HERE rather than in preceding steps for the reason above.
          # `rc=` and not a bare call throughout: this step runs under `-e`, and
          # a bare invocation would abort before the diagnostic below could name
          # what went wrong.
          rc=0
          bash scripts/deploy/require-local-deploy-daemon.sh || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::the staging PIN has been reverted to $OLD_IMAGE, but the local-deploy daemon fingerprint FAILED (exit ${rc}) — this job will not mutate containers on a daemon it cannot identify. The running tenants are still on the failed candidate; this needs an operator."
            exit "$rc"
          fi

          rc=0
          tc="$(bash scripts/deploy/require-deploy-toolchain.sh \
            'DEPLOY_PYTHON3:python3:python3:--version' \
            'KUBECTL:kubectl:kubectl:version --client')" || rc=$?
          if [ "$rc" -ne 0 ] || [ -z "$tc" ]; then
            echo "::error::the staging PIN has been reverted to $OLD_IMAGE, but the deploy toolchain could not be resolved on runner '${RUNNER_NAME:-<unknown>}' (exit ${rc}). The k8s tenants are still on the failed candidate; this needs an operator."
            exit 1
          fi
          printf '%s\n' "$tc" > "$RUNNER_TEMP/toolchain.env"
          set -a
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/toolchain.env"
          set +a

          rc=0
          bash scripts/deploy/resolve-k8s-fleet-census.sh \
            --env-out "$RUNNER_TEMP/fleet-census.env" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::the staging PIN has been reverted to $OLD_IMAGE, but the FLEET could not be: this job could not resolve a cluster credential + substrate census (exit ${rc}). The running tenants are still on the failed candidate. This needs an operator, not a rerun."
            exit "$rc"
          fi
          set -a
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/fleet-census.env"
          set +a

          # OLD_DIGEST is the digest the CP was pinned to before this run. It is
          # what the k8s workloads must go back to, and it is repo-relative by
          # construction in the roller — the same reason the forward roll passes
          # a digest rather than $OLD_IMAGE, whose registry host the tenant
          # workloads do not pull from. Empty means advance-pin found no prior
          # pin: there is then no k8s target to revert TO, which must be said out
          # loud rather than silently rolling only the docker arm.
          if [ -z "${OLD_DIGEST-}" ]; then
            echo "::error::advance-pin exposed no old_digest, so the k8s tenant fleet has no digest to revert to. The pin is back on $OLD_IMAGE but the running k8s tenants are NOT. Operator attention needed."
            exit 1
          fi
          export K8S_TENANT_DIGEST="$OLD_DIGEST"
          export EXCLUDE_SLUGS="${STAGING_FLEET_EXCLUDE_SLUGS-}"

          if [ -n "$OLD_GIT_SHA" ]; then
            EXPECTED_BUILD_SHA="$OLD_GIT_SHA" bash scripts/deploy/redeploy-staging-fleet.sh --image "$OLD_IMAGE"
          else
            bash scripts/deploy/redeploy-staging-fleet.sh --image "$OLD_IMAGE"
          fi
      - name: ran-sentinel END (proves this job's body ran to completion)
        id: ran_end
        if: always()
        env:
          RAN_SENTINEL_JOB: rollback-pin
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_RUN_ID-}" ]; then
            echo "::error::ran-sentinel: GITHUB_RUN_ID is empty or unset — refusing to emit a token that is not bound to this run, because an unbound token makes every downstream comparison unfalsifiable."
            exit 1
          fi
          printf 'token=ran-sentinel/v1 %s end run=%s\n' "$RAN_SENTINEL_JOB" "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "ran-sentinel END emitted for $RAN_SENTINEL_JOB (run $GITHUB_RUN_ID)"

  # bp-exempt: terminal audit of a post-merge staging CD job; informational
  # surfacing of a phantom rollback-pin, not a pre-merge branch-protection gate.
  rollback-audit:
    name: rollback-audit (prove rollback-pin itself actually executed)
    needs: [advance-pin, redeploy-fleet, runtime-image-readiness, e2e-smoke, rollback-pin]
    # ALWAYS-RUN. rollback-pin is the job that undoes a bad deploy, and it is on
    # the same persistent fleet runners that produce phantoms — task 885373 was
    # a phantom rollback-pin. A rollback that never ran must not be mistaken for
    # one that succeeded, because the staging pin is then left on a candidate
    # that genuinely FAILED.
    #
    # This job can itself phantom. That is not turtles-all-the-way-down: today a
    # SINGLE undelivered task hides the fact that no rollback happened, whereas
    # after this job two must be lost in the same run — and a phantom here still
    # leaves the run RED with no rollback recorded, which is the loud state we
    # want anyway.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Require a ran-sentinel from rollback-pin
        env:
          ADVANCE_RESULT: ${{ needs.advance-pin.result }}
          REDEPLOY_RESULT: ${{ needs.redeploy-fleet.result }}
          READINESS_RESULT: ${{ needs.runtime-image-readiness.result }}
          E2E_RESULT: ${{ needs.e2e-smoke.result }}
          REDEPLOY_BEGIN: ${{ needs.redeploy-fleet.outputs.ran_begin }}
          REDEPLOY_END: ${{ needs.redeploy-fleet.outputs.ran_end }}
          READINESS_BEGIN: ${{ needs.runtime-image-readiness.outputs.ran_begin }}
          READINESS_END: ${{ needs.runtime-image-readiness.outputs.ran_end }}
          E2E_BEGIN: ${{ needs.e2e-smoke.outputs.ran_begin }}
          E2E_END: ${{ needs.e2e-smoke.outputs.ran_end }}
          ROLLBACK_RESULT: ${{ needs.rollback-pin.result }}
          ROLLBACK_BEGIN: ${{ needs.rollback-pin.outputs.ran_begin }}
          ROLLBACK_END: ${{ needs.rollback-pin.outputs.ran_end }}
        run: |
          set -euo pipefail
          . scripts/deploy/ran-sentinel.sh

          VERDICT="$(ran_sentinel_classify rollback-pin "${ROLLBACK_RESULT-}" "${ROLLBACK_BEGIN-}" "${ROLLBACK_END-}")"
          echo "rollback-pin result=${ROLLBACK_RESULT-} ran-sentinel verdict=$VERDICT"
          case "$VERDICT" in
            ran-ok | ran-failed | ran-failed-partial)
              # It executed. Whatever it reported is a real report, and is
              # already visible on the run — nothing for this job to add.
              echo "::notice::rollback-pin executed (verdict=$VERDICT); its result is a genuine verdict."
              exit 0
              ;;
          esac

          # rollback-pin either never ran, or reported green without reaching its
          # own last step. Establish whether a revert was actually owed, so the
          # error says which of the two harms happened.
          RAN_SENTINEL_REPORT="$(mktemp)"
          export RAN_SENTINEL_REPORT
          DECISION="$(ran_sentinel_decide \
            redeploy-fleet          "${REDEPLOY_RESULT-}"  "${REDEPLOY_BEGIN-}"  "${REDEPLOY_END-}" \
            runtime-image-readiness "${READINESS_RESULT-}" "${READINESS_BEGIN-}" "${READINESS_END-}" \
            e2e-smoke               "${E2E_RESULT-}"       "${E2E_BEGIN-}"       "${E2E_END-}")" || DECISION="UNKNOWN"
          cat "$RAN_SENTINEL_REPORT" || true
          rm -f "$RAN_SENTINEL_REPORT"

          if [ "${ADVANCE_RESULT-}" = "success" ] && [ "$DECISION" = "ROLLBACK" ]; then
            echo "::error::rollback-pin NEVER EXECUTED (ran-sentinel verdict=$VERDICT) on a run whose candidate path VERIFIABLY FAILED. The staging tenant pin is LEFT ON A FAILED CANDIDATE and the fleet was never reverted. Revert by hand; do not rerun this workflow, which would advance the pin again."
          else
            echo "::error::rollback-pin NEVER EXECUTED (ran-sentinel verdict=$VERDICT). No revert was owed on this run, but the job's result is not a verdict — treat it as an infra fault, not as a green."
          fi
          exit 1
